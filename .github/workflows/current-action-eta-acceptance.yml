name: Current Action ETA Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/current-action-eta-acceptance.yml'
      - 'src/observer_sandbox/telegram_bot.py'

jobs:
  acceptance:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Stage candidate source on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/observer-current-eta-candidate && mkdir -p /tmp/observer-current-eta-candidate'
          rsync -az -e "ssh -p $VPS_PORT" src/ "$VPS_USER@$VPS_HOST:/tmp/observer-current-eta-candidate/src/"

      - name: Prove current-action ETA UI on disposable production copy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            TMP_DB=$(mktemp /tmp/observer-current-eta.XXXXXX.sqlite3)
            trap "rm -f $TMP_DB $TMP_DB-wal $TMP_DB-shm; rm -rf /tmp/observer-current-eta-candidate" EXIT
            cp /var/lib/observer-sandbox/observer.sqlite3 "$TMP_DB"
            export OBSERVER_SANDBOX_DB="$TMP_DB"
            export PYTHONPATH=/tmp/observer-current-eta-candidate/src
            .venv/bin/python - <<"PY"
          import json
          import os
          from observer_sandbox.db import connect
          from observer_sandbox.observer_query import character_summary, observer_status
          from observer_sandbox.runtime import initialize
          from observer_sandbox.telegram_bot import _fmt_character, _fmt_status

          db = os.environ["OBSERVER_SANDBOX_DB"]
          initialize(db)
          with connect(db) as conn:
              character = character_summary(conn, "char_darian")
              status = observer_status(conn, "char_darian")

          # Presentation proof is deterministic and does not require a model call.
          status["pending_action"] = {
              "action": "read",
              "target": "obj_acceptance_fixture",
              "duration_minutes": 10,
              "speed_at_plan": 1.0,
              "planned_sim_time": "2025-05-01T16:20:00+00:00",
              "due_wall_time": 1300.0,
          }
          status["pending_target_name"] = "Field Manual"
          status["character"] = character["state"]

          card = _fmt_character(character, status, now_wall=1000.0)
          runtime = _fmt_status(status, now_wall=1000.0)
          for text in (card, runtime):
              assert "10 sim min" in text
              assert "~10 min real @ 1x" in text
              assert "01-05-2025 (Thursday) 04:30 PM" in text
              assert "~5 min real" in text

          print(json.dumps({
              "ok": True,
              "disposable": True,
              "candidate_source": True,
              "model_calls": 0,
              "character_eta_visible": True,
              "runtime_eta_visible": True,
              "expected_sim_time": "2025-05-01T16:30:00+00:00",
              "remaining_real_minutes": 5,
          }, indent=2, sort_keys=True))
          PY
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            unset PYTHONPATH
            echo "--- PRODUCTION READBACK (UNCHANGED BY ACCEPTANCE COPY) ---"
            .venv/bin/sandboxctl status
            .venv/bin/sandboxctl living-status
          '
