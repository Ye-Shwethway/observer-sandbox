name: Autonomy Control

on:
  workflow_dispatch:
    inputs:
      command:
        description: Safe autonomy control operation
        required: true
        type: choice
        options:
          - status
          - canary-once
          - disable
          - pause
          - resume
          - speed
      speed:
        description: Speed multiplier, required only for speed command
        required: false
        default: "1"
        type: string

jobs:
  control:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Apply explicit control operation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          COMMAND: ${{ inputs.command }}
          SPEED: ${{ inputs.speed }}
        run: |
          case "$COMMAND" in
            status) REMOTE_COMMAND="autonomy status" ;;
            canary-once) REMOTE_COMMAND="autonomy canary-once" ;;
            disable) REMOTE_COMMAND="autonomy disable" ;;
            pause) REMOTE_COMMAND="autonomy pause" ;;
            resume) REMOTE_COMMAND="autonomy resume" ;;
            speed)
              test -n "$SPEED"
              case "$SPEED" in *[!0-9.]*|'') echo "Invalid speed" >&2; exit 2;; esac
              REMOTE_COMMAND="autonomy speed $SPEED"
              ;;
            *) echo "Unsupported control command" >&2; exit 2 ;;
          esac

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd /opt/observer-sandbox && export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3 && .venv/bin/sandboxctl $REMOTE_COMMAND && .venv/bin/sandboxctl autonomy-status"

# Deliberately no continuous 'enable' option here. Production continuous autonomy
# remains gated on an explicit Creator approval and a later intentional control change.
