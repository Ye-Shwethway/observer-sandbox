name: Training Movement Contract Normalization v1 Acceptance

on:
  pull_request:
    paths:
      - 'src/observer_sandbox/training_methods.py'
      - 'src/observer_sandbox/training_anatomy.py'
      - 'src/observer_sandbox/model_decision.py'
      - 'config/training_methods.v1.json'
      - 'config/training_movements.v1.json'
      - 'tests/test_training_movement_contract_normalization_v1.py'
      - 'tests/test_training_method_semantics_v1.py'
      - 'tests/test_training_anatomy_v1.py'
      - 'tests/test_model_decision.py'
      - '.github/workflows/training-movement-contract-normalization-v1-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'src/observer_sandbox/training_methods.py'
      - 'src/observer_sandbox/training_anatomy.py'
      - 'src/observer_sandbox/model_decision.py'
      - 'config/training_methods.v1.json'
      - 'config/training_movements.v1.json'
      - 'tests/test_training_movement_contract_normalization_v1.py'
      - 'tests/test_training_method_semantics_v1.py'
      - 'tests/test_training_anatomy_v1.py'
      - 'tests/test_model_decision.py'
      - '.github/workflows/training-movement-contract-normalization-v1-acceptance.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: >-
          pytest -q
          tests/test_training_movement_contract_normalization_v1.py
          tests/test_training_method_semantics_v1.py
          tests/test_training_anatomy_v1.py
          tests/test_model_decision.py
