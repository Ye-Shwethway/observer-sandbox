name: Cognition Behavior Eval

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cognition-behavior-eval.yml'

jobs:
  evaluate:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Evaluate Darian cognition on disposable DB copy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          # Scenarios require valid action path, grounded reason, and realistic overnight sleep duration.
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            TMP_DB=$(mktemp /tmp/observer-cognition-eval.XXXXXX.sqlite3)
            trap "rm -f $TMP_DB $TMP_DB-wal $TMP_DB-shm" EXIT
            cp /var/lib/observer-sandbox/observer.sqlite3 "$TMP_DB"
            export OBSERVER_SANDBOX_DB="$TMP_DB"
            .venv/bin/python - <<"PY"
          import json
          import os
          from observer_sandbox.behavior_eval import run_behavior_matrix
          from observer_sandbox.db import connect

          with connect(os.environ["OBSERVER_SANDBOX_DB"]) as conn:
              result = run_behavior_matrix(conn)
              print(json.dumps(result, indent=2, sort_keys=True))
              if not result["ok"]:
                  raise SystemExit("Cognition behavior matrix failed")
          PY
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            .venv/bin/sandboxctl status
            .venv/bin/sandboxctl living-status
            .venv/bin/sandboxctl autonomy-status
          '
