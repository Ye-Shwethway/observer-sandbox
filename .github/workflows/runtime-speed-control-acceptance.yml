name: Runtime Speed Control Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-speed-control-acceptance.yml'
      - 'src/observer_sandbox/autonomy.py'

jobs:
  acceptance:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Stage candidate source and config on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/observer-speed-candidate && mkdir -p /tmp/observer-speed-candidate'
          rsync -az -e "ssh -p $VPS_PORT" src/ "$VPS_USER@$VPS_HOST:/tmp/observer-speed-candidate/src/"
          rsync -az -e "ssh -p $VPS_PORT" config/ "$VPS_USER@$VPS_HOST:/tmp/observer-speed-candidate/config/"

      - name: Prove speed rescheduling on disposable production copy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            TMP_DB=$(mktemp /tmp/observer-speed.XXXXXX.sqlite3)
            trap "rm -f $TMP_DB $TMP_DB-wal $TMP_DB-shm; rm -rf /tmp/observer-speed-candidate" EXIT
            cp /var/lib/observer-sandbox/observer.sqlite3 "$TMP_DB"
            export OBSERVER_SANDBOX_DB="$TMP_DB"
            export PYTHONPATH=/tmp/observer-speed-candidate/src
            .venv/bin/python - <<"PY"
          import json
          import os
          from observer_sandbox.actor_runtime import pending_action
          from observer_sandbox.autonomy import set_autonomy_paused, set_autonomy_speed
          from observer_sandbox.db import connect
          from observer_sandbox.runtime import initialize
          from observer_sandbox.simulation import runtime_value, set_runtime_value

          db = os.environ["OBSERVER_SANDBOX_DB"]
          initialize(db)
          with connect(db) as conn:
              actor_id = "char_darian"
              action_id = "acceptance-runtime-speed-action"
              sim_time = str(runtime_value(conn, "sim_time", "2025-05-01T00:00:00+00:00"))
              conn.execute("UPDATE actor_runtime SET pending_action_id=NULL WHERE actor_id=?", (actor_id,))
              conn.execute("DELETE FROM action_instances WHERE id=?", (action_id,))
              conn.execute(
                  """INSERT INTO action_instances(
                      id,action_type,actor_id,place_id,target_id,status,duration_minutes,intent,
                      participants_json,resources_json,conditions_json,modifiers_json,
                      planned_sim_time,planned_wall_time,due_wall_time,speed_at_plan,outcome_json
                  ) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",
                  (action_id,"idle",actor_id,None,None,"in_progress",60,"acceptance speed fixture",
                   "[]","[]","{}","{}",sim_time,1000.0,4600.0,1.0,"{}"),
              )
              conn.execute("UPDATE actor_runtime SET pending_action_id=? WHERE actor_id=?", (action_id, actor_id))
              set_runtime_value(conn, "speed", 1.0)
              set_runtime_value(conn, "paused", False)
              conn.commit()

              status = set_autonomy_speed(conn, 60.0, now_wall=1600.0)
              first = pending_action(conn, actor_id)
              assert status["speed"] == 60.0
              assert first["action_id"] == action_id
              assert abs(first["due_wall_time"] - 1650.0) < 0.001
              assert first["speed_at_plan"] == 60.0

              set_autonomy_paused(conn, True, now_wall=1620.0)
              set_autonomy_paused(conn, False, now_wall=1720.0)
              resumed = pending_action(conn, actor_id)
              assert abs(resumed["due_wall_time"] - 1750.0) < 0.001

              print(json.dumps({
                  "ok": True,
                  "disposable": True,
                  "candidate_source": True,
                  "model_calls": 0,
                  "action_preserved": resumed["action_id"] == action_id,
                  "speed": status["speed"],
                  "due_after_1x_to_60x": first["due_wall_time"],
                  "due_after_100s_pause": resumed["due_wall_time"],
              }, indent=2, sort_keys=True))
          PY
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            unset PYTHONPATH
            echo "--- PRODUCTION READBACK (UNCHANGED BY ACCEPTANCE COPY) ---"
            .venv/bin/sandboxctl status
            .venv/bin/sandboxctl living-status
          '
