name: Bounded Autonomy Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomy-acceptance.yml'

jobs:
  acceptance:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Run accelerated recovery simulation on disposable production copy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            TMP_DB=$(mktemp /tmp/observer-autonomy-acceptance.XXXXXX.sqlite3)
            trap "rm -f $TMP_DB $TMP_DB-wal $TMP_DB-shm" EXIT
            cp /var/lib/observer-sandbox/observer.sqlite3 "$TMP_DB"
            export OBSERVER_SANDBOX_DB="$TMP_DB"
            .venv/bin/python - <<"PY"
          import json
          import os
          from observer_sandbox.autonomy import autonomy_tick
          from observer_sandbox.db import connect
          from observer_sandbox.simulation import runtime_value, set_runtime_value, snapshot
          from observer_sandbox.world import set_field

          db = os.environ["OBSERVER_SANDBOX_DB"]
          with connect(db) as conn:
              # Preserve the copied character/world state but detach it from any live in-flight scheduler bookkeeping.
              set_runtime_value(conn, "autonomy_enabled", True)
              set_runtime_value(conn, "paused", False)
              set_runtime_value(conn, "speed", 3600.0)
              set_runtime_value(conn, "autonomy_pending_action", None)
              set_runtime_value(conn, "autonomy_lease", None)
              set_runtime_value(conn, "autonomy_retry", None)
              set_field(conn, "char_darian", "runtime.current_action", "idle")
              conn.commit()

              before = snapshot(conn)
              trajectory = []
              now_wall = 1000.0
              max_actions = 6

              def needs_acceptable(state):
                  return (
                      state["energy"] >= 35.0
                      and state["hunger"] < 55.0
                      and state["thirst"] < 55.0
                      and state["sleepiness"] < 65.0
                      and state["cleanliness"] > 45.0
                  )

              for index in range(max_actions):
                  if index > 0 and needs_acceptable(snapshot(conn)):
                      break
                  planned = autonomy_tick(conn, now_wall=now_wall)
                  assert planned["state"] == "planned", planned
                  pending = planned["pending"]
                  due = float(pending["due_wall_time"])
                  completed = autonomy_tick(conn, now_wall=due)
                  assert completed["state"] == "completed", completed
                  state_after = snapshot(conn)
                  trajectory.append({
                      "step": index + 1,
                      "action": pending["action"],
                      "target": pending.get("target"),
                      "duration_minutes": pending["duration_minutes"],
                      "reason": pending.get("reason"),
                      "after": state_after,
                  })
                  now_wall = due + 1.0

              after = snapshot(conn)
              assert runtime_value(conn, "autonomy_pending_action", None) is None
              print(json.dumps({
                  "ok": True,
                  "disposable": True,
                  "speed": 3600.0,
                  "max_model_calls": max_actions,
                  "before": before,
                  "trajectory": trajectory,
                  "after": after,
                  "needs_acceptable": needs_acceptable(after),
              }, indent=2, sort_keys=True))
          PY
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            echo "--- PRODUCTION READBACK (UNCHANGED BY ACCEPTANCE COPY) ---"
            .venv/bin/sandboxctl status
            .venv/bin/sandboxctl living-status
          '
