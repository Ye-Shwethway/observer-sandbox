name: Inventory Foundation v1 Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/items.v1.json'
      - 'config/worlds/home.inventory.v1.json'
      - 'src/observer_sandbox/inventory.py'
      - 'src/observer_sandbox/composition_schema.py'
      - 'src/observer_sandbox/db.py'
      - 'src/observer_sandbox/runtime.py'
      - 'scripts/validation/validate_inventory_foundation_v1.py'
      - 'tests/test_inventory_foundation_v1.py'
      - '.github/workflows/inventory-foundation-v1-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    uses: ./.github/workflows/reusable-production-copy-validation.yml
    with:
      validator_path: scripts/validation/validate_inventory_foundation_v1.py
    secrets: inherit
