name: Strength Progression Auto Activation v1 Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/observer_sandbox/strength_progression_activation.py'
      - 'src/observer_sandbox/service.py'
      - 'scripts/validation/validate_progression_activation_compatibility.py'
      - 'tests/test_strength_progression_activation_v1.py'
      - '.github/workflows/strength-progression-auto-activation-v1-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    uses: ./.github/workflows/reusable-production-copy-validation.yml
    with:
      validator_path: scripts/validation/validate_progression_activation_compatibility.py
    secrets: inherit
