name: P3 Training Readiness Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p3-training-readiness-acceptance.yml'
      - 'src/observer_sandbox/simulation.py'
      - 'src/observer_sandbox/training_modifiers.py'
      - 'src/observer_sandbox/profile_observer.py'

jobs:
  acceptance:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Stage candidate source on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/observer-p3-readiness-candidate && mkdir -p /tmp/observer-p3-readiness-candidate'
          rsync -az -e "ssh -p $VPS_PORT" src/ "$VPS_USER@$VPS_HOST:/tmp/observer-p3-readiness-candidate/src/"

      - name: Prove readiness modifier on disposable production copy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            TMP_DB=$(mktemp /tmp/observer-p3-readiness.XXXXXX.sqlite3)
            trap "rm -f $TMP_DB $TMP_DB-wal $TMP_DB-shm; rm -rf /tmp/observer-p3-readiness-candidate" EXIT
            cp /var/lib/observer-sandbox/observer.sqlite3 "$TMP_DB"
            export OBSERVER_SANDBOX_DB="$TMP_DB"
            export PYTHONPATH=/tmp/observer-p3-readiness-candidate/src
            .venv/bin/python - <<"PY"
          import json
          import os
          from observer_sandbox.actor_runtime import actor_runtime, set_actor_runtime, set_retry
          from observer_sandbox.db import connect
          from observer_sandbox.profile_observer import profile_section
          from observer_sandbox.runtime import initialize
          from observer_sandbox.simulation import Action, apply_action, validate_action
          from observer_sandbox.world import set_field

          db = os.environ["OBSERVER_SANDBOX_DB"]
          initialize(db)

          def reset_runtime(conn):
              actor_id = "char_darian"
              runtime = actor_runtime(conn, actor_id)
              if runtime["pending_action_id"]:
                  conn.execute(
                      "UPDATE action_instances SET status=?,updated_at=CURRENT_TIMESTAMP WHERE id=? AND status IN (?,?)",
                      ("cancelled", runtime["pending_action_id"], "planned", "in_progress"),
                  )
              set_actor_runtime(conn, actor_id, pending_action_id=None)
              conn.execute(
                  "UPDATE actor_runtime SET lease_owner=NULL,lease_expires_at=NULL WHERE actor_id=?",
                  (actor_id,),
              )
              set_retry(conn, actor_id, None)
              set_field(conn, actor_id, "runtime.location", "loc_thorne_estate_home_gym")
              set_field(conn, actor_id, "runtime.current_action", "idle")
              conn.commit()

          def set_state(conn, energy, thirst, sleepiness, fatigue):
              set_field(conn, "char_darian", "needs.energy", energy)
              set_field(conn, "char_darian", "needs.thirst", thirst)
              set_field(conn, "char_darian", "needs.sleepiness", sleepiness)
              set_field(conn, "char_darian", "physiology.fatigue", fatigue, authority="physiology_engine", source="p3.3-acceptance")
              conn.commit()

          with connect(db) as conn:
              reset_runtime(conn)

              set_state(conn, 80.0, 15.0, 15.0, 0.0)
              healthy = apply_action(
                  conn,
                  Action("train", 60, "obj_thorne_estate_gym_free_weights", "P3.3 healthy readiness acceptance"),
              )
              healthy_row = conn.execute(
                  "SELECT modifiers_json FROM action_instances WHERE actor_id=? ORDER BY created_at DESC,id DESC LIMIT 1",
                  ("char_darian",),
              ).fetchone()
              healthy_mod = json.loads(healthy_row["modifiers_json"])["training_readiness"]
              assert healthy_mod["readiness"] == 1.0, healthy_mod
              assert healthy_mod["fatigue_cost_multiplier"] == 1.0, healthy_mod
              assert healthy["fatigue"] == 18.5, healthy

              set_state(conn, 50.0, 45.0, 45.0, 40.0)
              recovery = profile_section(conn, "char_darian", "recovery")
              readiness_row = next(row for row in recovery["content"] if row["field_key"] == "training.readiness")
              degraded = apply_action(
                  conn,
                  Action("train", 60, "obj_thorne_estate_gym_free_weights", "P3.3 degraded readiness acceptance"),
              )
              degraded_row = conn.execute(
                  "SELECT modifiers_json,outcome_json FROM action_instances WHERE actor_id=? ORDER BY created_at DESC,id DESC LIMIT 1",
                  ("char_darian",),
              ).fetchone()
              degraded_modifiers = json.loads(degraded_row["modifiers_json"])
              degraded_outcome = json.loads(degraded_row["outcome_json"])
              degraded_mod = degraded_modifiers["training_readiness"]
              assert 0.0 < degraded_mod["readiness"] < 1.0, degraded_mod
              assert 1.0 < degraded_mod["fatigue_cost_multiplier"] <= 1.5, degraded_mod
              assert readiness_row["value"] == round(degraded_mod["readiness"] * 100.0, 1), (readiness_row, degraded_mod)
              assert degraded["fatigue"] > 58.5, degraded
              assert degraded_outcome["modifiers"]["training_readiness"] == degraded_mod

              set_state(conn, 90.0, 5.0, 5.0, 70.0)
              blocked = False
              try:
                  validate_action(
                      conn,
                      "char_darian",
                      Action("train", 60, "obj_thorne_estate_gym_free_weights", "must remain blocked"),
                  )
              except ValueError as exc:
                  blocked = "fatigue" in str(exc).lower()
              assert blocked

              print(json.dumps({
                  "ok": True,
                  "disposable": True,
                  "candidate_source": True,
                  "model_calls": 0,
                  "healthy_after_fatigue": healthy["fatigue"],
                  "healthy_modifier": healthy_mod,
                  "degraded_after_fatigue": degraded["fatigue"],
                  "degraded_modifier": degraded_mod,
                  "telegram_recovery_readiness_percent": readiness_row["value"],
                  "hard_fatigue_blocked": True,
              }, indent=2, sort_keys=True))
          PY
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            unset PYTHONPATH
            echo "--- PRODUCTION READBACK (UNCHANGED BY P3.3 ACCEPTANCE COPY) ---"
            .venv/bin/sandboxctl status
            .venv/bin/sandboxctl living-status
          '
