name: Strength Live Cycle Validation v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/strength-live-cycle-validation-v1.yml'
      - 'src/observer_sandbox/strength_progression.py'
      - 'src/observer_sandbox/strength_progression_activation.py'
      - 'src/observer_sandbox/recovery_realization.py'
      - 'src/observer_sandbox/stimulus_saturation.py'
      - 'src/observer_sandbox/adaptation_curve.py'
      - 'src/observer_sandbox/simulation.py'
      - 'docs/STRENGTH_LIVE_CYCLE_VALIDATION_V1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Stage candidate source
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/observer-strength-live-cycle-v1 && mkdir -p /tmp/observer-strength-live-cycle-v1'
          rsync -az -e "ssh -p $VPS_PORT" src/ "$VPS_USER@$VPS_HOST:/tmp/observer-strength-live-cycle-v1/src/"
      - name: Read live baseline and validate full cycle on disposable production copy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            LIVE_DB=/var/lib/observer-sandbox/observer.sqlite3
            TMP_DB=$(mktemp /tmp/observer-strength-live-cycle-v1.XXXXXX.sqlite3)
            trap "rm -f $TMP_DB $TMP_DB-wal $TMP_DB-shm; rm -rf /tmp/observer-strength-live-cycle-v1" EXIT

            echo "--- LIVE READ-ONLY BASELINE ---"
            export PYTHONPATH=/tmp/observer-strength-live-cycle-v1/src
            LIVE_DB="$LIVE_DB" .venv/bin/python - <<"PY"
          import json, os, sqlite3

          live_db = os.environ["LIVE_DB"]
          conn = sqlite3.connect(f"file:{live_db}?mode=ro", uri=True)
          conn.row_factory = sqlite3.Row
          try:
              sim_row = conn.execute("SELECT value_json FROM runtime_state WHERE key='sim_time'").fetchone()
              speed_row = conn.execute("SELECT value_json FROM runtime_state WHERE key='speed'").fetchone()
              strength = conn.execute(
                  "SELECT value_json,mode,authority,source,observed_at FROM character_profile_values WHERE entity_id=? AND field_key=?",
                  ("char_darian", "raps_pa.strength"),
              ).fetchone()
              fatigue_row = conn.execute(
                  "SELECT value_json FROM fields WHERE entity_id=? AND field_key=?",
                  ("char_darian", "physiology.fatigue"),
              ).fetchone()
              pending = conn.execute(
                  """
                  SELECT ai.id,ai.action_type,ai.target_id,ai.duration_minutes,ai.status,ai.planned_sim_time,ai.ended_sim_time
                  FROM actor_runtime ar
                  LEFT JOIN action_instances ai ON ai.id=ar.pending_action_id
                  WHERE ar.actor_id=?
                  """,
                  ("char_darian",),
              ).fetchone()
              rows = conn.execute(
                  "SELECT id,sim_time,payload_json FROM events WHERE actor_id=? AND event_type='action_completed'",
                  ("char_darian",),
              ).fetchall()
              stimulus = []
              for row in rows:
                  payload = json.loads(row["payload_json"] or "{}")
                  evidence = payload.get("training_stimulus")
                  if isinstance(evidence, dict) and evidence.get("domain") == "strength" and float(evidence.get("stimulus_units") or 0) > 0:
                      stimulus.append({
                          "event_id": int(row["id"]),
                          "sim_time": row["sim_time"],
                          "stimulus_units": float(evidence["stimulus_units"]),
                          "effective_minutes": evidence.get("effective_minutes"),
                      })
              settlements = conn.execute(
                  "SELECT id,sim_time,payload_json FROM events WHERE actor_id=? AND event_type='strength_progression_settled'",
                  ("char_darian",),
              ).fetchall()
              consumed = set()
              for row in settlements:
                  payload = json.loads(row["payload_json"] or "{}")
                  for event_id in payload.get("consumed_stimulus_event_ids") or []:
                      if isinstance(event_id, int):
                          consumed.add(event_id)
              unconsumed = [item for item in stimulus if item["event_id"] not in consumed]
              print(json.dumps({
                  "live_read_only": True,
                  "sim_time": json.loads(sim_row["value_json"]) if sim_row else None,
                  "speed": json.loads(speed_row["value_json"]) if speed_row else None,
                  "strength": {
                      "value": json.loads(strength["value_json"]),
                      "mode": strength["mode"],
                      "authority": strength["authority"],
                      "source": strength["source"],
                      "observed_at": strength["observed_at"],
                  } if strength else None,
                  "fatigue": json.loads(fatigue_row["value_json"]) if fatigue_row else None,
                  "pending_action": dict(pending) if pending and pending["id"] else None,
                  "strength_stimulus_count": len(stimulus),
                  "unconsumed_strength_stimulus": unconsumed,
                  "settlement_count": len(settlements),
              }, indent=2, sort_keys=True))
          finally:
              conn.close()
          PY

            cp "$LIVE_DB" "$TMP_DB"
            export OBSERVER_SANDBOX_DB="$TMP_DB"
            .venv/bin/python - <<"PY"
          import json, math, os
          from datetime import datetime, timedelta

          from observer_sandbox.adaptation_curve import strength_level_factor
          from observer_sandbox.db import connect
          from observer_sandbox.recovery_realization import recovery_time_factor, strength_recovery_realization_evidence
          from observer_sandbox.runtime import initialize
          from observer_sandbox.simulation import Action, apply_action, snapshot
          from observer_sandbox.stimulus_saturation import recent_strength_stimulus_units, saturation_factor
          from observer_sandbox.strength_progression import BASE_POSITIVE_SCALE, SETTLEMENT_EVENT_TYPE
          from observer_sandbox.strength_progression_activation import maybe_settle_strength_progression

          db = os.environ["OBSERVER_SANDBOX_DB"]
          actor = "char_darian"
          initialize(db)

          def strength_value(conn):
              row = conn.execute(
                  "SELECT value_json FROM character_profile_values WHERE entity_id=? AND field_key=?",
                  (actor, "raps_pa.strength"),
              ).fetchone()
              return float(json.loads(row["value_json"]))

          def stimulus_rows(conn):
              found = []
              for row in conn.execute(
                  "SELECT id,sim_time,payload_json FROM events WHERE actor_id=? AND event_type='action_completed'",
                  (actor,),
              ).fetchall():
                  payload = json.loads(row["payload_json"] or "{}")
                  ev = payload.get("training_stimulus")
                  if isinstance(ev, dict) and ev.get("domain") == "strength" and float(ev.get("stimulus_units") or 0) > 0:
                      found.append({
                          "event_id": int(row["id"]),
                          "sim_time": row["sim_time"],
                          "stimulus_units": float(ev["stimulus_units"]),
                          "payload": payload,
                      })
              found.sort(key=lambda item: (datetime.fromisoformat(item["sim_time"]), item["event_id"]))
              return found

          def consumed_ids(conn):
              consumed = set()
              rows = conn.execute(
                  "SELECT payload_json FROM events WHERE actor_id=? AND event_type=?",
                  (actor, SETTLEMENT_EVENT_TYPE),
              ).fetchall()
              for row in rows:
                  payload = json.loads(row["payload_json"] or "{}")
                  for event_id in payload.get("consumed_stimulus_event_ids") or []:
                      if isinstance(event_id, int):
                          consumed.add(event_id)
              return consumed

          with connect(db) as conn:
              copied_baseline = snapshot(conn, actor)
              copied_strength_before = strength_value(conn)
              all_stimulus = stimulus_rows(conn)
              consumed_before = consumed_ids(conn)
              unconsumed = [item for item in all_stimulus if item["event_id"] not in consumed_before]
              assert unconsumed, "No real unconsumed Strength stimulus exists in the copied production DB"

              selected = unconsumed[-1]
              selected_time = datetime.fromisoformat(selected["sim_time"])
              selected_after = selected["payload"].get("after") or copied_baseline

              assert recovery_time_factor(0.0) == 0.0
              assert recovery_time_factor(6.0) == 0.0
              assert 0.0 < recovery_time_factor(24.0) < 1.0
              assert recovery_time_factor(48.0) == 1.0

              immediate = strength_recovery_realization_evidence(
                  conn, actor, as_of_sim_time=selected_time.isoformat(), state=selected_after
              )
              six_hour = strength_recovery_realization_evidence(
                  conn, actor, as_of_sim_time=(selected_time + timedelta(hours=6)).isoformat(), state=selected_after
              )
              mid = strength_recovery_realization_evidence(
                  conn, actor, as_of_sim_time=(selected_time + timedelta(hours=24)).isoformat(), state=selected_after
              )
              assert immediate.time_factor == 0.0
              assert six_hour.time_factor == 0.0
              assert 0.0 < mid.time_factor < 1.0

              settlement_events_before = conn.execute(
                  "SELECT COUNT(*) FROM events WHERE actor_id=? AND event_type=?",
                  (actor, SETTLEMENT_EVENT_TYPE),
              ).fetchone()[0]

              boundary_trace = []
              positive_result = None
              for _ in range(40):
                  if selected["event_id"] in consumed_ids(conn):
                      break
                  after = apply_action(conn, Action("rest", 240, None, "disposable Strength recovery validation"), actor)
                  result = maybe_settle_strength_progression(
                      conn, actor, as_of_sim_time=str(after["sim_time"]), state=after
                  )
                  boundary_trace.append({
                      "sim_time": after["sim_time"],
                      "fatigue": after["fatigue"],
                      "activation_state": result["state"],
                      "activation_reason": result["reason"],
                      "settlement_status": (result.get("settlement") or {}).get("status"),
                  })
                  settlement = result.get("settlement") or {}
                  if selected["event_id"] in (settlement.get("consumed_stimulus_event_ids") or []):
                      positive_result = result
                      break

              assert positive_result is not None, "Real copied Strength stimulus did not settle within bounded ordinary recovery actions"
              settlement = positive_result["settlement"]
              assert positive_result["reason"] == "eligible_stimulus"
              assert selected["event_id"] in settlement["consumed_stimulus_event_ids"]
              assert settlement["positive_delta"] > 0.0

              expected_positive = 0.0
              for ev in settlement.get("positive_evidence") or []:
                  expected = (
                      BASE_POSITIVE_SCALE
                      * float(ev["stimulus_units"])
                      * float(ev["level_factor"])
                      * float(ev["saturation_factor"])
                      * float(ev["recovery_factor"])
                  )
                  assert math.isclose(expected, float(ev["realized_delta"]), rel_tol=0, abs_tol=2e-9)
                  expected_positive += float(ev["realized_delta"])
              assert math.isclose(expected_positive, float(settlement["positive_delta"]), rel_tol=0, abs_tol=2e-9)

              copied_strength_after = strength_value(conn)
              assert math.isclose(
                  copied_strength_after,
                  copied_strength_before + float(settlement["net_delta"]),
                  rel_tol=0,
                  abs_tol=1e-6,
              )

              history = conn.execute(
                  """
                  SELECT old_value_json,new_value_json,mode,authority,reason,sim_time
                  FROM character_profile_history
                  WHERE entity_id=? AND field_key=?
                  ORDER BY id DESC LIMIT 1
                  """,
                  (actor, "raps_pa.strength"),
              ).fetchone()
              assert history is not None
              assert history["mode"] == "simulated"
              assert history["authority"] == "strength-progression-settlement-v1"

              consumed_after = consumed_ids(conn)
              assert selected["event_id"] in consumed_after
              settlement_events_after = conn.execute(
                  "SELECT COUNT(*) FROM events WHERE actor_id=? AND event_type=?",
                  (actor, SETTLEMENT_EVENT_TYPE),
              ).fetchone()[0]

              same_state = snapshot(conn, actor)
              same_boundary = maybe_settle_strength_progression(
                  conn, actor, as_of_sim_time=str(same_state["sim_time"]), state=same_state
              )
              assert same_boundary["state"] == "skipped"
              assert same_boundary["reason"] == "same_or_older_boundary"
              assert conn.execute(
                  "SELECT COUNT(*) FROM events WHERE actor_id=? AND event_type=?",
                  (actor, SETTLEMENT_EVENT_TYPE),
              ).fetchone()[0] == settlement_events_after

              recent_at_event = recent_strength_stimulus_units(conn, actor, as_of_sim_time=selected["sim_time"])
              selected_level = strength_level_factor(copied_strength_before)
              selected_saturation = saturation_factor(recent_at_event)

              print(json.dumps({
                  "ok": True,
                  "disposable_production_copy": True,
                  "validation_writes_to_live": False,
                  "model_calls": 0,
                  "telegram_calls": 0,
                  "copied_baseline": copied_baseline,
                  "real_stimulus": {
                      "event_id": selected["event_id"],
                      "sim_time": selected["sim_time"],
                      "stimulus_units": selected["stimulus_units"],
                      "recent_stimulus_at_event": recent_at_event,
                      "level_factor_at_copy_start": selected_level.level_factor,
                      "saturation_factor_at_event": selected_saturation,
                  },
                  "recovery_curve": {
                      "immediate": immediate.__dict__,
                      "six_hour": six_hour.__dict__,
                      "twenty_four_hour": mid.__dict__,
                  },
                  "boundary_trace": boundary_trace,
                  "settlement": settlement,
                  "strength_before": copied_strength_before,
                  "strength_after": copied_strength_after,
                  "settlement_events_before": settlement_events_before,
                  "settlement_events_after": settlement_events_after,
                  "same_boundary_replay": same_boundary,
                  "consumed_once": selected["event_id"] in consumed_after,
              }, indent=2, sort_keys=True, default=str))
          PY

            echo "--- LIVE SERVICE READBACK (NO VALIDATION MUTATION) ---"
            unset OBSERVER_SANDBOX_DB
            unset PYTHONPATH
            systemctl is-active observer-sandbox
            /opt/observer-sandbox/.venv/bin/sandboxctl --db "$LIVE_DB" status
          '
