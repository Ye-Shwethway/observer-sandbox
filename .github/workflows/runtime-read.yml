name: Runtime Read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-read.yml'

jobs:
  read-runtime:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Read live runtime
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          # autonomy-status includes mode, pending action and retry state.
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            sudo -n /usr/bin/systemctl is-active observer-sandbox
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            .venv/bin/sandboxctl status
            .venv/bin/sandboxctl living-status
            .venv/bin/sandboxctl autonomy-status
            if grep -Eq "^OBSERVER_NANOGPT_API_KEY=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              echo "NANOGPT_CREDENTIAL_PRESENT=true"
            else
              echo "NANOGPT_CREDENTIAL_PRESENT=false"
            fi
            if grep -Eq "^OBSERVER_GEMINI_API_KEY=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              echo "GEMINI_CREDENTIAL_PRESENT=true"
            else
              echo "GEMINI_CREDENTIAL_PRESENT=false"
            fi
          '
