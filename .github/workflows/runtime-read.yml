name: Runtime Read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-read.yml'

jobs:
  read-runtime:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Read live runtime
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          # Read-only runtime/status inspection. No model calls or state mutation.
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            sudo -n /usr/bin/systemctl is-active observer-sandbox
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            .venv/bin/sandboxctl status
            .venv/bin/sandboxctl living-status
            .venv/bin/sandboxctl autonomy-status
            .venv/bin/python -c "import json,sqlite3; db=sqlite3.connect(\"file:/var/lib/observer-sandbox/observer.sqlite3?mode=ro\",uri=True); db.row_factory=sqlite3.Row; rows=db.execute(\"SELECT field_key,value_json,mode,authority,source,observed_at FROM character_profile_values WHERE entity_id=? AND field_key IN (?,?) ORDER BY field_key\",(\"char_darian\",\"body.body_fat_pct\",\"body.weight_lb\")).fetchall(); event=db.execute(\"SELECT sim_time,payload_json FROM events WHERE actor_id=? AND event_type=? ORDER BY id DESC LIMIT 1\",(\"char_darian\",\"body_composition_progression_settled\")).fetchone(); payload=json.loads(event[\"payload_json\"]) if event else None; detail={\"fields\":[{\"field_key\":r[\"field_key\"],\"value\":json.loads(r[\"value_json\"]),\"mode\":r[\"mode\"],\"authority\":r[\"authority\"],\"source\":r[\"source\"],\"observed_at\":r[\"observed_at\"]} for r in rows],\"latest_settlement\":None if event is None else {\"sim_time\":event[\"sim_time\"],\"status\":payload.get(\"status\"),\"activation_boundary\":payload.get(\"activation_boundary\"),\"settled_through_sim_time\":payload.get(\"settled_through_sim_time\"),\"stat_mutated\":payload.get(\"stat_mutated\"),\"old\":payload.get(\"old\"),\"new\":payload.get(\"new\")}}; print(\"BODY_COMPOSITION=\"+json.dumps(detail,sort_keys=True))"
            .venv/bin/python -c "import json,sqlite3; db=sqlite3.connect(\"file:/var/lib/observer-sandbox/observer.sqlite3?mode=ro\",uri=True); db.row_factory=sqlite3.Row; row=db.execute(\"SELECT sim_time, payload_json FROM events WHERE actor_id=? AND event_type=? ORDER BY id DESC LIMIT 1\", (\"char_darian\", \"autonomy_error\")).fetchone(); payload=json.loads(row[\"payload_json\"]) if row else {}; detail={\"sim_time\":row[\"sim_time\"],\"stage\":payload.get(\"stage\"),\"error_type\":payload.get(\"error_type\"),\"message\":payload.get(\"message\"),\"retry_seconds\":payload.get(\"retry_seconds\")} if row else None; print(\"LATEST_AUTONOMY_ERROR=\" + json.dumps(detail, sort_keys=True))"
            if grep -Eq "^OBSERVER_GROQ_API_KEY=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              echo "GROQ_CREDENTIAL_PRESENT=true"
            else
              echo "GROQ_CREDENTIAL_PRESENT=false"
            fi
            if grep -Eq "^OBSERVER_NANOGPT_API_KEY=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              echo "NANOGPT_CREDENTIAL_PRESENT=true"
            else
              echo "NANOGPT_CREDENTIAL_PRESENT=false"
            fi
            if grep -Eq "^OBSERVER_GEMINI_API_KEY=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              echo "GEMINI_CREDENTIAL_PRESENT=true"
            else
              echo "GEMINI_CREDENTIAL_PRESENT=false"
            fi
          '
