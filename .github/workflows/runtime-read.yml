name: Runtime Read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-read.yml'

jobs:
  read-runtime:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Read live runtime
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          # Read-only runtime/status inspection. No model calls or state mutation.
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            sudo -n /usr/bin/systemctl is-active observer-sandbox
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            .venv/bin/sandboxctl status
            .venv/bin/sandboxctl living-status
            .venv/bin/sandboxctl autonomy-status
            .venv/bin/python - <<"PY"
import json
import sqlite3

db = sqlite3.connect("/var/lib/observer-sandbox/observer.sqlite3")
db.row_factory = sqlite3.Row
row = db.execute(
    "SELECT sim_time, payload_json FROM events WHERE actor_id=? AND event_type=? ORDER BY id DESC LIMIT 1",
    ("char_darian", "autonomy_error"),
).fetchone()
if row is None:
    print("LATEST_AUTONOMY_ERROR=null")
else:
    payload = json.loads(row["payload_json"])
    detail = {
        "sim_time": row["sim_time"],
        "stage": payload.get("stage"),
        "error_type": payload.get("error_type"),
        "message": payload.get("message"),
        "retry_seconds": payload.get("retry_seconds"),
    }
    print("LATEST_AUTONOMY_ERROR=" + json.dumps(detail, sort_keys=True))
PY
            if grep -Eq "^OBSERVER_GROQ_API_KEY=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              echo "GROQ_CREDENTIAL_PRESENT=true"
            else
              echo "GROQ_CREDENTIAL_PRESENT=false"
            fi
            if grep -Eq "^OBSERVER_NANOGPT_API_KEY=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              echo "NANOGPT_CREDENTIAL_PRESENT=true"
            else
              echo "NANOGPT_CREDENTIAL_PRESENT=false"
            fi
            if grep -Eq "^OBSERVER_GEMINI_API_KEY=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              echo "GEMINI_CREDENTIAL_PRESENT=true"
            else
              echo "GEMINI_CREDENTIAL_PRESENT=false"
            fi
          '
