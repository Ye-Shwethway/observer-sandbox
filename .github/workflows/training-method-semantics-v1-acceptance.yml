name: Training Method Semantics v1 Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/training_methods.v1.json'
      - 'src/observer_sandbox/training_methods.py'
      - 'src/observer_sandbox/model_decision.py'
      - 'src/observer_sandbox/event_log.py'
      - 'scripts/validation/validate_training_method_semantics_v1.py'
      - 'tests/test_training_method_semantics_v1.py'
      - '.github/workflows/training-method-semantics-v1-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    uses: ./.github/workflows/reusable-production-copy-validation.yml
    with:
      validator_path: scripts/validation/validate_training_method_semantics_v1.py
    secrets: inherit
