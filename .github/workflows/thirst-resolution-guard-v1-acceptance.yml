name: Thirst Resolution Guard v1 Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/observer_sandbox/need_resolution.py'
      - 'tests/test_thirst_resolution_guard.py'
      - 'docs/THIRST_RESOLUTION_GUARD_V1.md'
      - '.github/workflows/thirst-resolution-guard-v1-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Stage candidate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/observer-thirst-resolution-v1 && mkdir -p /tmp/observer-thirst-resolution-v1'
          rsync -az -e "ssh -p $VPS_PORT" src/ "$VPS_USER@$VPS_HOST:/tmp/observer-thirst-resolution-v1/src/"
          rsync -az -e "ssh -p $VPS_PORT" config/ "$VPS_USER@$VPS_HOST:/tmp/observer-thirst-resolution-v1/config/"
      - name: Dry-run observed post-meal thirst incident on production copy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            TMP_DB=$(mktemp /tmp/observer-thirst-resolution-v1.XXXXXX.sqlite3)
            trap "rm -f $TMP_DB $TMP_DB-wal $TMP_DB-shm; rm -rf /tmp/observer-thirst-resolution-v1" EXIT
            cp /var/lib/observer-sandbox/observer.sqlite3 "$TMP_DB"
            export OBSERVER_SANDBOX_DB="$TMP_DB"
            export PYTHONPATH=/tmp/observer-thirst-resolution-v1/src
            .venv/bin/python - <<"PY"
          import json, os
          from observer_sandbox.db import connect
          from observer_sandbox.model_decision import ModelDecisionProvider
          from observer_sandbox.runtime import initialize
          from observer_sandbox.simulation import Action, apply_action, snapshot
          from observer_sandbox.world import set_field

          db = os.environ["OBSERVER_SANDBOX_DB"]
          initialize(db)
          with connect(db) as conn:
              def set_state(location, hunger, thirst, energy=75.6, sleepiness=13.8, cleanliness=40.5):
                  set_field(conn, "char_darian", "runtime.location", location)
                  set_field(conn, "char_darian", "needs.energy", energy)
                  set_field(conn, "char_darian", "needs.hunger", hunger)
                  set_field(conn, "char_darian", "needs.thirst", thirst)
                  set_field(conn, "char_darian", "needs.sleepiness", sleepiness)
                  set_field(conn, "char_darian", "physiology.cleanliness", cleanliness)
                  conn.commit()
                  return snapshot(conn, "char_darian")

              provider = ModelDecisionProvider(conn)

              post_meal = set_state("loc_thorne_estate_food_storage", 13.7, 54.9)
              enriched = provider._enrich_state(post_meal)
              options = enriched["action_options"]
              assert enriched["decision_signals"]["highest_priority"]["need"] == "thirst"
              assert enriched["decision_signals"]["highest_priority"]["level"] == "strong"
              assert {(o["action"], o["target"]) for o in options} == {
                  ("move", "loc_thorne_estate_training_hall")
              }
              assert all(o["action"] != "train" for o in options)

              kitchen = set_state("loc_thorne_estate_kitchen", 14.0, 55.2)
              enriched_kitchen = provider._enrich_state(kitchen)
              kitchen_options = enriched_kitchen["action_options"]
              assert {(o["action"], o["target"]) for o in kitchen_options} == {
                  ("drink", "obj_thorne_estate_kitchen_drinking_water")
              }
              before_thirst = kitchen["thirst"]
              after = apply_action(
                  conn,
                  Action("drink", 5, "obj_thorne_estate_kitchen_drinking_water", "resolve strong thirst"),
                  "char_darian",
              )
              assert after["thirst"] < 50.0
              assert after["thirst"] < before_thirst

              original_incident = set_state("loc_thorne_estate_food_storage", 61.3, 50.2, energy=69.6, sleepiness=10.8, cleanliness=41.3)
              original_enriched = provider._enrich_state(original_incident)
              original_options = original_enriched["action_options"]
              assert {(o["action"], o["target"]) for o in original_options} == {
                  ("eat", "obj_thorne_estate_food_storage_provisions")
              }

              print(json.dumps({
                  "ok": True,
                  "disposable": True,
                  "candidate_source": True,
                  "model_calls": 0,
                  "post_meal_thirst": post_meal["thirst"],
                  "post_meal_options": options,
                  "kitchen_options": kitchen_options,
                  "resolved_thirst": after["thirst"],
                  "hunger_first_regression_preserved": True,
                  "training_displaced_while_strong_thirst": False
              }, indent=2, sort_keys=True))
          PY
            unset PYTHONPATH
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            echo "--- LIVE PRODUCTION READBACK (UNCHANGED BY DRY-RUN) ---"
            .venv/bin/sandboxctl status
          '
