name: Skill Evidence Semantics v1 Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/skill-evidence-semantics-v1-acceptance.yml'
      - 'config/skill_practice_methods.v1.json'
      - 'config/skill_progression.v1.json'
      - 'src/observer_sandbox/skill_practice.py'
      - 'src/observer_sandbox/skill_progression.py'
      - 'src/observer_sandbox/event_log.py'
      - 'src/observer_sandbox/runtime.py'
      - 'scripts/validation/validate_skill_evidence_semantics_v1.py'
      - 'tests/test_skill_evidence_semantics_v1.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/skill-evidence-semantics-v1-acceptance.yml'
      - 'config/skill_practice_methods.v1.json'
      - 'config/skill_progression.v1.json'
      - 'src/observer_sandbox/skill_practice.py'
      - 'src/observer_sandbox/skill_progression.py'
      - 'src/observer_sandbox/event_log.py'
      - 'src/observer_sandbox/runtime.py'
      - 'scripts/validation/validate_skill_evidence_semantics_v1.py'
      - 'tests/test_skill_evidence_semantics_v1.py'

jobs:
  production-copy:
    uses: ./.github/workflows/reusable-production-copy-validation.yml
    with:
      validator_path: scripts/validation/validate_skill_evidence_semantics_v1.py
    secrets: inherit
