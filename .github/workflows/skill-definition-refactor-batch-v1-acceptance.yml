name: Skill Definition Refactor Batch v1 Acceptance

on:
  pull_request:
    paths:
      - "config/skill_definitions.v1.json"
      - "src/observer_sandbox/skill_definitions.py"
      - "src/observer_sandbox/skill_application_requirements.py"
      - "src/observer_sandbox/skill_capability.py"
      - "tests/test_skill_definition_format_v1.py"
      - "tests/test_skill_application_requirements_v1.py"
      - "tests/test_skill_capability_resolution_v1.py"
      - "tests/test_skill_definition_refactor_batch_v1.py"
      - ".github/workflows/skill-definition-refactor-batch-v1-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "config/skill_definitions.v1.json"
      - "src/observer_sandbox/skill_definitions.py"
      - "src/observer_sandbox/skill_application_requirements.py"
      - "src/observer_sandbox/skill_capability.py"
      - "tests/test_skill_definition_format_v1.py"
      - "tests/test_skill_application_requirements_v1.py"
      - "tests/test_skill_capability_resolution_v1.py"
      - "tests/test_skill_definition_refactor_batch_v1.py"
      - ".github/workflows/skill-definition-refactor-batch-v1-acceptance.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: >-
          pytest -q
          tests/test_skill_definition_format_v1.py
          tests/test_skill_application_requirements_v1.py
          tests/test_skill_capability_resolution_v1.py
          tests/test_skill_definition_refactor_batch_v1.py
          tests/test_represented_skill_tasks_v1.py
