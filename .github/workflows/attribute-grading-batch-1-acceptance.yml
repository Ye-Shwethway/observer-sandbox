name: Attribute Grading Batch 1 Acceptance

on:
  workflow_dispatch:

jobs:
  acceptance:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Stage candidate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/observer-attribute-grading-batch1 && mkdir -p /tmp/observer-attribute-grading-batch1/config'
          rsync -az -e "ssh -p $VPS_PORT" src/ "$VPS_USER@$VPS_HOST:/tmp/observer-attribute-grading-batch1/src/"
          rsync -az -e "ssh -p $VPS_PORT" config/profile_sections.v1.json "$VPS_USER@$VPS_HOST:/tmp/observer-attribute-grading-batch1/config/profile_sections.v1.json"
      - name: Dry-run profile grading contracts on production copy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            TMP_DB=$(mktemp /tmp/observer-attribute-grading-batch1.XXXXXX.sqlite3)
            trap "rm -f $TMP_DB $TMP_DB-wal $TMP_DB-shm; rm -rf /tmp/observer-attribute-grading-batch1" EXIT
            cp /var/lib/observer-sandbox/observer.sqlite3 "$TMP_DB"
            export OBSERVER_SANDBOX_DB="$TMP_DB"
            export PYTHONPATH=/tmp/observer-attribute-grading-batch1/src
            .venv/bin/python - <<"PY"
          import json, os
          from observer_sandbox.db import connect
          from observer_sandbox.grading import ATTRIBUTE_RAPS_100_FIELDS, evaluate_raps_100
          from observer_sandbox.profile_observer import profile_section
          from observer_sandbox.telegram_profile_browser import _fmt_profile_section

          def fmt_number(value):
              return f"{float(value):.1f}".rstrip("0").rstrip(".")

          db = os.environ["OBSERVER_SANDBOX_DB"]
          with connect(db) as conn:
              before_profile = {
                  row["field_key"]: (row["value_json"], row["mode"])
                  for row in conn.execute(
                      "SELECT field_key,value_json,mode FROM character_profile_values WHERE entity_id=?",
                      ("char_darian",),
                  ).fetchall()
              }
              before_skills = [
                  tuple(row)
                  for row in conn.execute(
                      "SELECT skill_key,score,tier,experience FROM character_skills WHERE entity_id=? ORDER BY skill_key",
                      ("char_darian",),
                  ).fetchall()
              ]

              attributes = profile_section(conn, "char_darian", "attributes")
              by_key = {item["field_key"]: item for item in attributes["content"]}
              assert len(ATTRIBUTE_RAPS_100_FIELDS) == 36
              assert all("grade" in by_key[key] for key in ATTRIBUTE_RAPS_100_FIELDS)
              assert all(by_key[key]["grade"]["scheme_id"] == "raps-100-proof-v1" for key in ATTRIBUTE_RAPS_100_FIELDS)
              assert "grade" not in by_key["raps_ia.iq"]

              body = profile_section(conn, "char_darian", "body")
              raw_body = [item for item in body["content"] if item.get("kind") == "field"]
              derived_body = [item for item in body["content"] if item.get("kind") == "derived_grade"]
              assert raw_body and all("grade" not in item for item in raw_body)
              assert derived_body
              assert all(item["grade"]["scheme_id"] != "raps-100-proof-v1" for item in derived_body)

              skills = profile_section(conn, "char_darian", "skills")
              assert skills["content"]
              assert all(item["grade"]["scheme_id"] == "skill-proficiency-100-v1" for item in skills["content"])

              text = _fmt_profile_section(attributes)
              for key in ("raps_pa.strength", "raps_pa.stamina", "raps_ia.medical_knowledge"):
                  item = by_key[key]
                  expected = evaluate_raps_100(float(item["value"]))
                  label = item["label"]
                  display = fmt_number(item["value"])
                  expected_row = f"{label}   {display} ({expected.grade}) · {expected.label}"
                  assert expected_row in text
              physical = attributes["section"]["group_grades"]["raps_pa"]
              overall = attributes["section"]["overall_grade"]
              physical_grade = physical["grade"]
              physical_label = physical["label"]
              overall_grade = overall["grade"]
              overall_label = overall["label"]
              assert f"Physical ({physical_grade}) · {physical_label}" in text
              assert f"Overall ({overall_grade}) · {overall_label}" in text
              assert "IQ   140 (" not in text

              body_text = _fmt_profile_section(body)
              skills_text = _fmt_profile_section(skills)
              assert "Waist / Shoulders" in body_text
              assert "Waist / Height" in body_text
              assert "Hand To Hand Combat" in skills_text
              assert "(S) · Expert" in skills_text

              after_profile = {
                  row["field_key"]: (row["value_json"], row["mode"])
                  for row in conn.execute(
                      "SELECT field_key,value_json,mode FROM character_profile_values WHERE entity_id=?",
                      ("char_darian",),
                  ).fetchall()
              }
              after_skills = [
                  tuple(row)
                  for row in conn.execute(
                      "SELECT skill_key,score,tier,experience FROM character_skills WHERE entity_id=? ORDER BY skill_key",
                      ("char_darian",),
                  ).fetchall()
              ]
              assert before_profile == after_profile
              assert before_skills == after_skills
              print(json.dumps({
                  "ok": True,
                  "disposable": True,
                  "candidate_source": True,
                  "model_calls": 0,
                  "graded_attribute_count": len(ATTRIBUTE_RAPS_100_FIELDS),
                  "iq_excluded": True,
                  "raw_body_ungraded": True,
                  "derived_body_grading": True,
                  "skills_separate_scheme": True,
                  "raw_profile_unchanged": True,
                  "raw_skills_unchanged": True,
                  "telegram_rendered": True,
                  "physical_grade": physical,
                  "overall_grade": overall
              }, indent=2, sort_keys=True))
          PY
            unset PYTHONPATH
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            echo "--- PRODUCTION READBACK (UNCHANGED) ---"
            .venv/bin/sandboxctl status
          '
