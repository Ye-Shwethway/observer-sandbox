name: Skill Definition Format v1 Acceptance

on:
  pull_request:
    paths:
      - 'config/skill_definitions.v1.json'
      - 'config/skill_practice_methods.v1.json'
      - 'config/skill_progression.v1.json'
      - 'src/observer_sandbox/skill_definitions.py'
      - 'src/observer_sandbox/grading.py'
      - 'src/observer_sandbox/profile_schema.py'
      - 'tests/test_skill_definition_format_v1.py'
      - 'scripts/validation/validate_skill_definition_format_v1.py'
      - '.github/workflows/skill-definition-format-v1-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'config/skill_definitions.v1.json'
      - 'config/skill_practice_methods.v1.json'
      - 'config/skill_progression.v1.json'
      - 'src/observer_sandbox/skill_definitions.py'
      - 'src/observer_sandbox/grading.py'
      - 'src/observer_sandbox/profile_schema.py'
      - 'tests/test_skill_definition_format_v1.py'
      - 'scripts/validation/validate_skill_definition_format_v1.py'
      - '.github/workflows/skill-definition-format-v1-acceptance.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_skill_definition_format_v1.py
      - run: python scripts/validation/validate_skill_definition_format_v1.py
