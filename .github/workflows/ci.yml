name: CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: sandboxctl --db /tmp/observer.sqlite3 init
      - run: sandboxctl --db /tmp/observer.sqlite3 status
