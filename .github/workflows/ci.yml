name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Run tests
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee /tmp/pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            encoded=$(tail -n 120 /tmp/pytest.log | base64 -w0)
            echo "::error title=pytest-debug::$encoded"
            exit "$status"
          fi
      - run: sandboxctl --db /tmp/observer.sqlite3 init
      - run: sandboxctl --db /tmp/observer.sqlite3 status
