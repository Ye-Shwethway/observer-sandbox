name: Full Regression

on:
  schedule:
    - cron: '15 18 * * *'
  workflow_dispatch:

concurrency:
  group: full-regression
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run full suite in parallel and report slow tests
        run: pytest -q -n auto --dist loadfile --durations=30

      - name: CLI smoke init
        run: sandboxctl --db /tmp/observer.sqlite3 init

      - name: CLI smoke status
        run: sandboxctl --db /tmp/observer.sqlite3 status
