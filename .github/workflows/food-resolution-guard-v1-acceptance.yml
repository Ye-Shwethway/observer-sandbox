name: Food Resolution Guard v1 Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/worlds/home.v1.json'
      - 'config/characters/darian.autonomy-policy.json'
      - 'src/observer_sandbox/need_resolution.py'
      - 'src/observer_sandbox/model_decision.py'
      - 'tests/test_food_resolution_guard_v1.py'
      - 'docs/FOOD_RESOLUTION_GUARD_V1.md'
      - '.github/workflows/food-resolution-guard-v1-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Stage candidate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/observer-food-resolution-v1 && mkdir -p /tmp/observer-food-resolution-v1'
          rsync -az -e "ssh -p $VPS_PORT" src/ "$VPS_USER@$VPS_HOST:/tmp/observer-food-resolution-v1/src/"
          rsync -az -e "ssh -p $VPS_PORT" config/ "$VPS_USER@$VPS_HOST:/tmp/observer-food-resolution-v1/config/"
      - name: Dry-run observed hunger incident on production copy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            TMP_DB=$(mktemp /tmp/observer-food-resolution-v1.XXXXXX.sqlite3)
            trap "rm -f $TMP_DB $TMP_DB-wal $TMP_DB-shm; rm -rf /tmp/observer-food-resolution-v1" EXIT
            cp /var/lib/observer-sandbox/observer.sqlite3 "$TMP_DB"
            export OBSERVER_SANDBOX_DB="$TMP_DB"
            export PYTHONPATH=/tmp/observer-food-resolution-v1/src
            .venv/bin/python - <<"PY"
          import json, os
          from observer_sandbox.db import connect
          from observer_sandbox.model_decision import ModelDecisionProvider
          from observer_sandbox.runtime import initialize
          from observer_sandbox.simulation import Action, apply_action, snapshot
          from observer_sandbox.world import get_field, set_field

          db = os.environ["OBSERVER_SANDBOX_DB"]
          initialize(db)
          with connect(db) as conn:
              world_revision = conn.execute(
                  "SELECT value_json FROM runtime_state WHERE key=?",
                  ("world_identity_revision",),
              ).fetchone()[0]
              assert json.loads(world_revision) == "thorne-estate-v3.1-food-resolution"

              provisions = conn.execute(
                  "SELECT name,capabilities_json FROM entities WHERE id=?",
                  ("obj_thorne_estate_food_storage_provisions",),
              ).fetchone()
              assert provisions["name"] == "Stored Food Provisions"
              assert "eat" in json.loads(provisions["capabilities_json"])
              shelves = conn.execute(
                  "SELECT capabilities_json FROM entities WHERE id=?",
                  ("obj_thorne_estate_food_storage_supply_shelves",),
              ).fetchone()
              assert json.loads(shelves["capabilities_json"]) == ["inspect"]

              set_field(conn, "char_darian", "runtime.location", "loc_thorne_estate_food_storage")
              set_field(conn, "char_darian", "needs.hunger", 61.3)
              set_field(conn, "char_darian", "needs.thirst", 50.2)
              set_field(conn, "char_darian", "needs.energy", 69.6)
              set_field(conn, "char_darian", "needs.sleepiness", 10.8)
              set_field(conn, "char_darian", "physiology.cleanliness", 41.3)
              conn.commit()

              state = snapshot(conn, "char_darian")
              provider = ModelDecisionProvider(conn)
              enriched = provider._enrich_state(state)
              options = enriched["action_options"]
              assert len(options) == 1
              assert options[0]["action"] == "eat"
              assert options[0]["target"] == "obj_thorne_estate_food_storage_provisions"
              assert options[0]["effects"]["needs.hunger"] < 0

              before_hunger = state["hunger"]
              after = apply_action(
                  conn,
                  Action("eat", 20, "obj_thorne_estate_food_storage_provisions", "resolve strong hunger"),
                  "char_darian",
              )
              assert after["hunger"] < 55.0
              assert after["hunger"] < before_hunger
              assert get_field(conn, "obj_thorne_estate_food_storage_supply_shelves", "game.effects", {}) == {}

              print(json.dumps({
                  "ok": True,
                  "disposable": True,
                  "candidate_source": True,
                  "model_calls": 0,
                  "reproduced_incident_hunger": before_hunger,
                  "strong_hunger_options": options,
                  "resolved_hunger": after["hunger"],
                  "supply_shelves_inspect_only": True,
                  "training_displaced_while_strong_hunger": False,
                  "world_revision": json.loads(world_revision)
              }, indent=2, sort_keys=True))
          PY
            unset PYTHONPATH
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            echo "--- LIVE PRODUCTION READBACK (UNCHANGED BY DRY-RUN) ---"
            .venv/bin/sandboxctl status
          '
