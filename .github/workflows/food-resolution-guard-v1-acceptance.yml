name: Causal Need Resolution v2 Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/characters/darian.autonomy-policy.json'
      - 'src/observer_sandbox/need_resolution.py'
      - 'src/observer_sandbox/model_decision.py'
      - 'tests/test_food_resolution_guard_v1.py'
      - 'tests/test_cognition_policy.py'
      - 'docs/CAUSAL_NEED_RESOLUTION_V2.md'
      - '.github/workflows/food-resolution-guard-v1-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Stage candidate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/observer-causal-need-v2 && mkdir -p /tmp/observer-causal-need-v2'
          rsync -az -e "ssh -p $VPS_PORT" src/ "$VPS_USER@$VPS_HOST:/tmp/observer-causal-need-v2/src/"
          rsync -az -e "ssh -p $VPS_PORT" config/ "$VPS_USER@$VPS_HOST:/tmp/observer-causal-need-v2/config/"
      - name: Dry-run observed thirst follow-up on production copy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            TMP_DB=$(mktemp /tmp/observer-causal-need-v2.XXXXXX.sqlite3)
            trap "rm -f $TMP_DB $TMP_DB-wal $TMP_DB-shm; rm -rf /tmp/observer-causal-need-v2" EXIT
            cp /var/lib/observer-sandbox/observer.sqlite3 "$TMP_DB"
            export OBSERVER_SANDBOX_DB="$TMP_DB"
            export PYTHONPATH=/tmp/observer-causal-need-v2/src
            .venv/bin/python - <<"PY"
          import json, os
          from observer_sandbox.db import connect
          from observer_sandbox.model_decision import ModelDecisionProvider
          from observer_sandbox.runtime import initialize
          from observer_sandbox.simulation import Action, apply_action, snapshot
          from observer_sandbox.world import set_field

          db = os.environ["OBSERVER_SANDBOX_DB"]
          initialize(db)
          with connect(db) as conn:
              provider = ModelDecisionProvider(conn)

              # Isolate this legacy thirst/hunger fixture from the newer fatigue need.
              set_field(conn, "char_darian", "runtime.location", "loc_thorne_estate_food_storage")
              set_field(conn, "char_darian", "needs.hunger", 62.9)
              set_field(conn, "char_darian", "needs.thirst", 51.9)
              set_field(conn, "char_darian", "needs.energy", 68.3)
              set_field(conn, "char_darian", "needs.sleepiness", 12.8)
              set_field(conn, "char_darian", "physiology.cleanliness", 60.0)
              set_field(conn, "char_darian", "physiology.fatigue", 20.0)
              conn.commit()

              both = provider._enrich_state(snapshot(conn, "char_darian"))
              assert [x["need"] for x in both["decision_signals"]["needs_attention"][:2]] == ["thirst", "hunger"]
              assert both["action_options"]
              assert all(x["action"] == "move" for x in both["action_options"])
              assert {x["target"] for x in both["action_options"]} == {"loc_thorne_estate_training_hall"}

              set_field(conn, "char_darian", "runtime.location", "loc_thorne_estate_training_hall")
              set_field(conn, "char_darian", "needs.hunger", 14.0)
              set_field(conn, "char_darian", "needs.thirst", 55.2)
              set_field(conn, "char_darian", "needs.energy", 75.5)
              set_field(conn, "char_darian", "needs.sleepiness", 14.0)
              set_field(conn, "char_darian", "physiology.cleanliness", 60.0)
              set_field(conn, "char_darian", "physiology.fatigue", 20.0)
              conn.commit()

              hall = provider._enrich_state(snapshot(conn, "char_darian"))
              assert hall["decision_signals"]["highest_priority"]["need"] == "thirst"
              assert hall["action_options"]
              assert all(x["action"] == "move" for x in hall["action_options"])
              assert all(x["action"] != "train" for x in hall["action_options"])

              set_field(conn, "char_darian", "runtime.location", "loc_thorne_estate_kitchen")
              conn.commit()
              kitchen_before = snapshot(conn, "char_darian")
              kitchen = provider._enrich_state(kitchen_before)
              assert len(kitchen["action_options"]) == 1
              drink = kitchen["action_options"][0]
              assert drink["action"] == "drink"
              assert drink["target"] == "obj_thorne_estate_kitchen_drinking_water"
              assert drink["effects"]["needs.thirst"] < 0

              after = apply_action(
                  conn,
                  Action("drink", 5, "obj_thorne_estate_kitchen_drinking_water", "rehydrate before training"),
                  "char_darian",
              )
              assert after["thirst"] < 50.0
              assert after["thirst"] < kitchen_before["thirst"]

              print(json.dumps({
                  "ok": True,
                  "disposable": True,
                  "candidate_source": True,
                  "model_calls": 0,
                  "both_strong_priority": [x["need"] for x in both["decision_signals"]["needs_attention"][:2]],
                  "food_storage_first_hop": both["action_options"],
                  "training_hall_thirst_options": hall["action_options"],
                  "kitchen_resolver": drink,
                  "thirst_before_drink": kitchen_before["thirst"],
                  "thirst_after_drink": after["thirst"],
                  "training_blocked_while_strong_thirst": True,
                  "fatigue_fixture_isolated": True
              }, indent=2, sort_keys=True))
          PY
            unset PYTHONPATH
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            echo "--- LIVE PRODUCTION READBACK (UNCHANGED BY DRY-RUN) ---"
            .venv/bin/sandboxctl status
          '
