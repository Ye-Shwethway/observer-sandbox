name: Research Action Semantics Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-action-semantics-acceptance.yml'
      - 'config/worlds/home.v1.json'
      - 'src/observer_sandbox/composition_schema.py'
      - 'src/observer_sandbox/model_decision.py'
      - 'src/observer_sandbox/duration_planning.py'
      - 'tests/test_research_action_semantics.py'
      - 'tests/test_model_action_vocabulary.py'
      - 'tests/test_minimum_action_timing.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-action-semantics-acceptance.yml'
      - 'config/worlds/home.v1.json'
      - 'src/observer_sandbox/composition_schema.py'
      - 'src/observer_sandbox/model_decision.py'
      - 'src/observer_sandbox/duration_planning.py'
      - 'tests/test_research_action_semantics.py'
      - 'tests/test_model_action_vocabulary.py'
      - 'tests/test_minimum_action_timing.py'

jobs:
  acceptance:
    if: >-
      ${{
        vars.VPS_DEPLOY_ENABLED == 'true' &&
        (github.event_name != 'pull_request' ||
         github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Stage candidate source and config on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/observer-research-candidate && mkdir -p /tmp/observer-research-candidate'
          rsync -az -e "ssh -p $VPS_PORT" src/ "$VPS_USER@$VPS_HOST:/tmp/observer-research-candidate/src/"
          rsync -az -e "ssh -p $VPS_PORT" config/ "$VPS_USER@$VPS_HOST:/tmp/observer-research-candidate/config/"

      - name: Prove research semantics on disposable production copy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            TMP_DB=$(mktemp /tmp/observer-research.XXXXXX.sqlite3)
            trap "rm -f $TMP_DB $TMP_DB-wal $TMP_DB-shm; rm -rf /tmp/observer-research-candidate" EXIT
            cp /var/lib/observer-sandbox/observer.sqlite3 "$TMP_DB"
            export OBSERVER_SANDBOX_DB="$TMP_DB"
            export PYTHONPATH=/tmp/observer-research-candidate/src
            .venv/bin/python - <<"PY"
          import json
          import os
          from observer_sandbox.db import connect
          from observer_sandbox.duration_planning import normalize_duration
          from observer_sandbox.location_runtime import set_dynamic_location
          from observer_sandbox.runtime import initialize
          from observer_sandbox.simulation import Action, action_options, apply_action, validate_action

          db = os.environ["OBSERVER_SANDBOX_DB"]
          initialize(db)
          library = "loc_thorne_estate_library"
          desk = "obj_thorne_estate_library_research_desk"
          shelf = "obj_thorne_estate_library_bookshelf"

          with connect(db) as conn:
              set_dynamic_location(conn, "char_darian", library)
              conn.commit()
              options = action_options(conn)
              research = [o for o in options if o["action"] == "research"]
              assert any(o["target"] == desk for o in research)
              assert all(o["target"] != shelf for o in research)
              validate_action(conn, "char_darian", Action("research", 45, desk, "review estate records"))
              try:
                  validate_action(conn, "char_darian", Action("research", 45, shelf, "invalid research target"))
              except ValueError:
                  pass
              else:
                  raise AssertionError("Bookshelf unexpectedly supports research")
              assert normalize_duration("research", desk, 5) == 30
              assert normalize_duration("research", desk, 200) == 90
              before_events = int(conn.execute("SELECT COUNT(*) FROM events").fetchone()[0])
              apply_action(conn, Action("research", 45, desk, "review estate records"))
              row = conn.execute("SELECT action_type,target_id,status,duration_minutes FROM action_instances ORDER BY rowid DESC LIMIT 1").fetchone()
              assert tuple(row) == ("research", desk, "completed", 45)
              after_events = int(conn.execute("SELECT COUNT(*) FROM events").fetchone()[0])
              assert after_events == before_events + 1

          print(json.dumps({
              "ok": True,
              "disposable": True,
              "candidate_source": True,
              "model_calls": 0,
              "research_target": desk,
              "preferred_duration": [30, 90],
              "first_class_completion": True,
              "unsupported_bookshelf_rejected": True,
              "additional_research_targets_allowed": True,
              "authoritative_dynamic_location": True,
          }, indent=2, sort_keys=True))
          PY
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            unset PYTHONPATH
            echo "--- PRODUCTION READBACK (UNCHANGED BY ACCEPTANCE COPY) ---"
            .venv/bin/sandboxctl status
            .venv/bin/sandboxctl living-status
          '
