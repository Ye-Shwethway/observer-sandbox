name: Dry Run Darian Decision

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dry-run-decision.yml'

jobs:
  dry-run:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Run non-mutating live decision dry-run
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            .venv/bin/sandboxctl ai dry-run-decision --character char_darian --role cognition
            .venv/bin/sandboxctl status
            .venv/bin/sandboxctl living-status
          '
