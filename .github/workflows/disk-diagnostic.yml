name: VPS Disk Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disk-diagnostic.yml'
  workflow_dispatch:

jobs:
  disk:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect disk usage
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -u
            echo "=== FILESYSTEMS ==="
            df -h / /opt /var /home 2>&1
            echo "=== APP TREE (KiB) ==="
            du -x -k -d2 /opt/observer-sandbox 2>/dev/null | sort -n | tail -n 40 || true
            echo "=== RUNTIME DATA TREE (KiB) ==="
            du -x -k -d2 /var/lib/observer-sandbox 2>/dev/null | sort -n | tail -n 40 || true
            echo "=== USER HOME TREE (KiB) ==="
            du -x -k -d2 "$HOME" 2>/dev/null | sort -n | tail -n 50 || true
            echo "=== RUNTIME FILES ==="
            ls -lahS /var/lib/observer-sandbox 2>/dev/null | head -n 40 || true
            echo "=== APP FILES ==="
            find /opt/observer-sandbox -xdev -type f -printf "%s %p\n" 2>/dev/null | sort -n | tail -n 40 || true
            echo "=== JOURNAL USAGE ==="
            journalctl --disk-usage 2>&1 || true
          '
