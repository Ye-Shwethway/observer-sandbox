name: Skill Progression Tactical Planning v1 Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/skill-progression-tactical-v1-acceptance.yml'
      - 'config/skill_progression.v1.json'
      - 'src/observer_sandbox/skill_progression.py'
      - 'src/observer_sandbox/training_methods.py'
      - 'config/training_methods.v1.json'
      - 'scripts/validation/validate_skill_progression_tactical_v1.py'
      - 'tests/test_skill_progression_tactical_v1.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/skill-progression-tactical-v1-acceptance.yml'
      - 'config/skill_progression.v1.json'
      - 'src/observer_sandbox/skill_progression.py'
      - 'src/observer_sandbox/training_methods.py'
      - 'config/training_methods.v1.json'
      - 'scripts/validation/validate_skill_progression_tactical_v1.py'
      - 'tests/test_skill_progression_tactical_v1.py'

jobs:
  production-copy:
    uses: ./.github/workflows/reusable-production-copy-validation.yml
    with:
      validator_path: scripts/validation/validate_skill_progression_tactical_v1.py
    secrets: inherit
