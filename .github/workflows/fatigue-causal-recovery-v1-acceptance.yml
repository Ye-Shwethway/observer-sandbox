name: Fatigue Causal Recovery v1 Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/characters/darian.autonomy-policy.json'
      - 'src/observer_sandbox/need_resolution.py'
      - 'src/observer_sandbox/model_decision.py'
      - 'tests/test_fatigue_causal_recovery_v1.py'
      - 'docs/FATIGUE_CAUSAL_RECOVERY_V1.md'
      - '.github/workflows/fatigue-causal-recovery-v1-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Stage candidate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/observer-fatigue-causal-v1 && mkdir -p /tmp/observer-fatigue-causal-v1'
          rsync -az -e "ssh -p $VPS_PORT" src/ "$VPS_USER@$VPS_HOST:/tmp/observer-fatigue-causal-v1/src/"
          rsync -az -e "ssh -p $VPS_PORT" config/ "$VPS_USER@$VPS_HOST:/tmp/observer-fatigue-causal-v1/config/"
      - name: Validate fatigue recovery and inspect suppression on disposable production copy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            TMP_DB=$(mktemp /tmp/observer-fatigue-causal-v1.XXXXXX.sqlite3)
            trap "rm -f $TMP_DB $TMP_DB-wal $TMP_DB-shm; rm -rf /tmp/observer-fatigue-causal-v1" EXIT
            cp /var/lib/observer-sandbox/observer.sqlite3 "$TMP_DB"
            export OBSERVER_SANDBOX_DB="$TMP_DB"
            export PYTHONPATH=/tmp/observer-fatigue-causal-v1/src
            .venv/bin/python - <<"PY"
          import json, os
          from observer_sandbox.db import connect
          from observer_sandbox.event_log import record_event
          from observer_sandbox.model_decision import ModelDecisionProvider
          from observer_sandbox.runtime import initialize
          from observer_sandbox.simulation import Action, apply_action, snapshot
          from observer_sandbox.world import set_field

          db = os.environ["OBSERVER_SANDBOX_DB"]
          actor = "char_darian"
          hall = "loc_thorne_estate_training_hall"
          initialize(db)
          with connect(db) as conn:
              copied_baseline = snapshot(conn, actor)

              # Reproduce the Creator-observed post-training state on the disposable copy only.
              set_field(conn, actor, "runtime.location", hall)
              set_field(conn, actor, "physiology.fatigue", 72.4)
              set_field(conn, actor, "needs.energy", 55.8)
              set_field(conn, actor, "needs.hunger", 28.6)
              set_field(conn, actor, "needs.thirst", 19.2)
              set_field(conn, actor, "needs.sleepiness", 26.1)
              set_field(conn, actor, "physiology.cleanliness", 92.9)
              conn.commit()

              provider = ModelDecisionProvider(conn)
              fatigued = provider._enrich_state(snapshot(conn, actor))
              highest = fatigued["decision_signals"]["highest_priority"]
              assert highest["need"] == "fatigue"
              assert highest["level"] == "critical"
              assert {(x["action"], x["target"]) for x in fatigued["action_options"]} == {("rest", None)}
              assert all(x["action"] not in {"train", "inspect", "use"} for x in fatigued["action_options"])

              before_rest = snapshot(conn, actor)
              after_rest = apply_action(conn, Action("rest", 180, None, "recover from systemic fatigue"), actor)
              assert after_rest["fatigue"] < before_rest["fatigue"]
              assert after_rest["fatigue"] < 55.0

              # Prove the repetition guard independently once physiology is comfortable.
              sim_time = snapshot(conn, actor)["sim_time"]
              for action, target in (("inspect", "fixture_a"), ("use", "fixture_b")):
                  record_event(
                      conn,
                      sim_time=sim_time,
                      actor_id=actor,
                      event_type="action_completed",
                      location_id=hall,
                      payload={"action": action, "target": target, "reason": "acceptance fixture"},
                  )
              conn.commit()
              shaped = provider._enrich_state(snapshot(conn, actor))
              assert shaped["action_options"]
              assert all(x["action"] not in {"inspect", "use"} for x in shaped["action_options"])

              print(json.dumps({
                  "ok": True,
                  "disposable_production_copy": True,
                  "production_mutated": False,
                  "model_calls": 0,
                  "copied_baseline": copied_baseline,
                  "reproduced_fatigue": before_rest["fatigue"],
                  "fatigue_priority": highest,
                  "fatigued_candidates": fatigued["action_options"],
                  "fatigue_after_180m_rest": after_rest["fatigue"],
                  "post_loop_candidates": shaped["action_options"]
              }, indent=2, sort_keys=True))
          PY
          '
