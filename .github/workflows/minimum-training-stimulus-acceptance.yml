name: Minimum Training Stimulus Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/observer_sandbox/simulation.py'
      - 'src/observer_sandbox/training_stimulus.py'
      - 'tests/test_minimum_training_stimulus_v1.py'
      - '.github/workflows/minimum-training-stimulus-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Run focused deterministic acceptance
        run: |
          pytest -q tests/test_minimum_training_stimulus_v1.py
