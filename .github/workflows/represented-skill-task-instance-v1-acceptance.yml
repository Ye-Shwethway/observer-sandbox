name: Represented Skill Task Instance v1 Acceptance

on:
  pull_request:
    paths:
      - "src/observer_sandbox/represented_skill_task_instance.py"
      - "src/observer_sandbox/represented_skill_tasks.py"
      - "src/observer_sandbox/actor_skill_capability.py"
      - "src/observer_sandbox/skill_capability.py"
      - "config/represented_skill_tasks.v1.json"
      - "config/skill_definitions.v1.json"
      - "tests/test_represented_skill_task_instance_v1.py"
      - ".github/workflows/represented-skill-task-instance-v1-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "src/observer_sandbox/represented_skill_task_instance.py"
      - "src/observer_sandbox/represented_skill_tasks.py"
      - "src/observer_sandbox/actor_skill_capability.py"
      - "src/observer_sandbox/skill_capability.py"
      - "config/represented_skill_tasks.v1.json"
      - "config/skill_definitions.v1.json"
      - "tests/test_represented_skill_task_instance_v1.py"
      - ".github/workflows/represented-skill-task-instance-v1-acceptance.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: >-
          pytest -q
          tests/test_skill_application_requirements_v1.py
          tests/test_skill_capability_resolution_v1.py
          tests/test_actor_skill_capability_adapter_v1.py
          tests/test_represented_skill_tasks_v1.py
          tests/test_represented_skill_task_instance_v1.py
