name: Deploy Observer Sandbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'deploy/observer-sandbox.service'
      - '.github/workflows/deploy.yml'

concurrency:
  group: observer-sandbox-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync application files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude 'runtime-data/' \
            -e "ssh -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:/opt/observer-sandbox/"

      - name: Provision optional runtime secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          OBSERVER_GEMINI_API_KEY: ${{ secrets.OBSERVER_GEMINI_API_KEY }}
          OBSERVER_GROQ_API_KEY: ${{ secrets.OBSERVER_GROQ_API_KEY }}
          OBSERVER_NANOGPT_API_KEY: ${{ secrets.OBSERVER_NANOGPT_API_KEY }}
          OBSERVER_OPENAI_API_KEY: ${{ secrets.OBSERVER_OPENAI_API_KEY }}
          OBSERVER_OPENROUTER_API_KEY: ${{ secrets.OBSERVER_OPENROUTER_API_KEY }}
          OBSERVER_TELEGRAM_BOT_TOKEN: ${{ secrets.OBSERVER_TELEGRAM_BOT_TOKEN }}
          OBSERVER_TELEGRAM_OWNER_ID: ${{ secrets.OBSERVER_TELEGRAM_OWNER_ID }}
          OBSERVER_TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.OBSERVER_TELEGRAM_ALLOWED_USER_IDS }}
        run: |
          {
            printf 'OBSERVER_GEMINI_API_KEY=%s\n' "$OBSERVER_GEMINI_API_KEY"
            printf 'OBSERVER_GROQ_API_KEY=%s\n' "$OBSERVER_GROQ_API_KEY"
            printf 'OBSERVER_NANOGPT_API_KEY=%s\n' "$OBSERVER_NANOGPT_API_KEY"
            printf 'OBSERVER_OPENAI_API_KEY=%s\n' "$OBSERVER_OPENAI_API_KEY"
            printf 'OBSERVER_OPENROUTER_API_KEY=%s\n' "$OBSERVER_OPENROUTER_API_KEY"
            printf 'OBSERVER_TELEGRAM_BOT_TOKEN=%s\n' "$OBSERVER_TELEGRAM_BOT_TOKEN"
            printf 'OBSERVER_TELEGRAM_OWNER_ID=%s\n' "$OBSERVER_TELEGRAM_OWNER_ID"
            printf 'OBSERVER_TELEGRAM_ALLOWED_USER_IDS=%s\n' "$OBSERVER_TELEGRAM_ALLOWED_USER_IDS"
          } | ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            umask 077
            cat > /var/lib/observer-sandbox/secrets.env
            chmod 600 /var/lib/observer-sandbox/secrets.env
          '

      - name: Install, configure cognition, restart, and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            test -d .venv || python3 -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -e .
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            .venv/bin/sandboxctl init
            if grep -Eq "^OBSERVER_GROQ_API_KEY=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              if .venv/bin/sandboxctl ai bootstrap-groq-cognition; then
                echo "Groq cognition bootstrap succeeded"
              elif grep -Eq "^OBSERVER_GEMINI_API_KEY=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
                echo "Groq cognition bootstrap failed; falling back to Gemini bootstrap"
                .venv/bin/sandboxctl ai bootstrap-gemini-cognition
              else
                echo "Groq cognition bootstrap failed; preserving existing cognition binding"
              fi
            elif grep -Eq "^OBSERVER_GEMINI_API_KEY=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              .venv/bin/sandboxctl ai bootstrap-gemini-cognition
            else
              echo "Cognition bootstrap skipped: no supported credential provisioned"
            fi
            sudo -n /usr/bin/install -m 0644 deploy/observer-sandbox.service /etc/systemd/system/observer-sandbox.service
            sudo -n /usr/bin/systemctl daemon-reload
            sudo -n /usr/bin/systemctl restart observer-sandbox
            sudo -n /usr/bin/systemctl is-active observer-sandbox
            .venv/bin/sandboxctl status
            .venv/bin/sandboxctl living-status
            .venv/bin/sandboxctl ai resolve cognition --character char_darian
            .venv/bin/python -m observer_sandbox.cognition_context_audit --db "$OBSERVER_SANDBOX_DB" --character char_darian
            if grep -Eq "^OBSERVER_TELEGRAM_BOT_TOKEN=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              echo "TELEGRAM_BOT_TOKEN_PRESENT=true"
              TOKEN=$(sed -n "s/^OBSERVER_TELEGRAM_BOT_TOKEN=//p" /var/lib/observer-sandbox/secrets.env | head -n1)
              TG_JSON=$(curl -sS --max-time 15 "https://api.telegram.org/bot${TOKEN}/getMe")
              TG_OK=$(printf "%s\n" "$TG_JSON" | .venv/bin/python -c "import json,sys; d=json.load(sys.stdin); print(str(bool(d.get(\"ok\"))).lower())")
              if [ "$TG_OK" = "true" ]; then
                echo "TELEGRAM_API_CONNECTED=true"
              else
                echo "TELEGRAM_API_CONNECTED=false"
                printf "%s\n" "$TG_JSON" | .venv/bin/python -c "import json,sys; d=json.load(sys.stdin); print(\"TELEGRAM_API_ERROR_CODE=\" + str(d.get(\"error_code\", \"\"))); print(\"TELEGRAM_API_DESCRIPTION=\" + str(d.get(\"description\", \"\")))"
                exit 1
              fi
            else
              echo "TELEGRAM_BOT_TOKEN_PRESENT=false"
              echo "TELEGRAM_API_CONNECTED=false"
            fi
            if grep -Eq "^OBSERVER_TELEGRAM_OWNER_ID=[0-9]+$" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              echo "TELEGRAM_OWNER_ID_PRESENT=true"
            else
              echo "TELEGRAM_OWNER_ID_PRESENT=false"
            fi
            if grep -Eq "^OBSERVER_TELEGRAM_ALLOWED_USER_IDS=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              echo "TELEGRAM_ALLOWED_USERS_PRESENT=true"
            else
              echo "TELEGRAM_ALLOWED_USERS_PRESENT=false"
            fi
          '
