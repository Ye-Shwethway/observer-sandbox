name: Deploy Observer Sandbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'deploy/**'
      - 'pyproject.toml'
      - 'migrations/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: observer-sandbox-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync application files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude 'runtime-data/' \
            -e "ssh -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:/opt/observer-sandbox/"

      - name: Install, diagnose sudo, restart, and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            test -d .venv || python3 -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -e .
            OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3 .venv/bin/sandboxctl init
            echo "REMOTE_USER=$(id -un)"
            echo "SYSTEMCTL=$(command -v systemctl)"
            ls -l /etc/sudoers.d/observer-sandbox 2>/dev/null || true
            sudo -n -l || true
            sudo -n /usr/bin/systemctl restart observer-sandbox
            sudo -n /usr/bin/systemctl is-active --quiet observer-sandbox
            OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3 .venv/bin/sandboxctl status
          '
