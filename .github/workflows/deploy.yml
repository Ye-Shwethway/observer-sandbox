name: Deploy Observer Sandbox
# Control-plane trigger: provision Gemini secret and cognition binding; do not enable autonomy.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'deploy/**'
      - 'pyproject.toml'
      - 'migrations/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: observer-sandbox-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync application files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude 'runtime-data/' \
            -e "ssh -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:/opt/observer-sandbox/"

      - name: Provision optional AI secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          OBSERVER_GEMINI_API_KEY: ${{ secrets.OBSERVER_GEMINI_API_KEY }}
          OBSERVER_NANOGPT_API_KEY: ${{ secrets.OBSERVER_NANOGPT_API_KEY }}
          OBSERVER_OPENAI_API_KEY: ${{ secrets.OBSERVER_OPENAI_API_KEY }}
          OBSERVER_OPENROUTER_API_KEY: ${{ secrets.OBSERVER_OPENROUTER_API_KEY }}
        run: |
          {
            printf 'OBSERVER_GEMINI_API_KEY=%s\n' "$OBSERVER_GEMINI_API_KEY"
            printf 'OBSERVER_NANOGPT_API_KEY=%s\n' "$OBSERVER_NANOGPT_API_KEY"
            printf 'OBSERVER_OPENAI_API_KEY=%s\n' "$OBSERVER_OPENAI_API_KEY"
            printf 'OBSERVER_OPENROUTER_API_KEY=%s\n' "$OBSERVER_OPENROUTER_API_KEY"
          } | ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            umask 077
            cat > /var/lib/observer-sandbox/secrets.env
            chmod 600 /var/lib/observer-sandbox/secrets.env
          '

      - name: Install, configure cognition, restart, and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            test -d .venv || python3 -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -e .
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            .venv/bin/sandboxctl init
            if grep -Eq "^OBSERVER_GEMINI_API_KEY=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              .venv/bin/sandboxctl ai bootstrap-gemini-cognition
            else
              echo "Gemini cognition bootstrap skipped: credential not provisioned"
            fi
            sudo -n /usr/bin/systemctl restart observer-sandbox
            sudo -n /usr/bin/systemctl is-active observer-sandbox
            .venv/bin/sandboxctl status
            .venv/bin/sandboxctl living-status
            .venv/bin/sandboxctl ai resolve cognition --character char_darian
          '
