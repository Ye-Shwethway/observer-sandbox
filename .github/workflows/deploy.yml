name: Deploy Observer Sandbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'deploy/observer-sandbox.service'
      - '.github/workflows/deploy.yml'

concurrency:
  group: observer-sandbox-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync application files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude 'runtime-data/' \
            -e "ssh -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:/opt/observer-sandbox/"

      - name: Provision optional runtime secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          OBSERVER_GEMINI_API_KEY: ${{ secrets.OBSERVER_GEMINI_API_KEY }}
          OBSERVER_GROQ_API_KEY: ${{ secrets.OBSERVER_GROQ_API_KEY }}
          OBSERVER_NANOGPT_API_KEY: ${{ secrets.OBSERVER_NANOGPT_API_KEY }}
          OBSERVER_OPENAI_API_KEY: ${{ secrets.OBSERVER_OPENAI_API_KEY }}
          OBSERVER_OPENROUTER_API_KEY: ${{ secrets.OBSERVER_OPENROUTER_API_KEY }}
          OBSERVER_TELEGRAM_BOT_TOKEN: ${{ secrets.OBSERVER_TELEGRAM_BOT_TOKEN }}
          OBSERVER_TELEGRAM_OWNER_ID: ${{ secrets.OBSERVER_TELEGRAM_OWNER_ID }}
          OBSERVER_TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.OBSERVER_TELEGRAM_ALLOWED_USER_IDS }}
        run: |
          {
            printf 'OBSERVER_GEMINI_API_KEY=%s\n' "$OBSERVER_GEMINI_API_KEY"
            printf 'OBSERVER_GROQ_API_KEY=%s\n' "$OBSERVER_GROQ_API_KEY"
            printf 'OBSERVER_NANOGPT_API_KEY=%s\n' "$OBSERVER_NANOGPT_API_KEY"
            printf 'OBSERVER_OPENAI_API_KEY=%s\n' "$OBSERVER_OPENAI_API_KEY"
            printf 'OBSERVER_OPENROUTER_API_KEY=%s\n' "$OBSERVER_OPENROUTER_API_KEY"
            printf 'OBSERVER_TELEGRAM_BOT_TOKEN=%s\n' "$OBSERVER_TELEGRAM_BOT_TOKEN"
            printf 'OBSERVER_TELEGRAM_OWNER_ID=%s\n' "$OBSERVER_TELEGRAM_OWNER_ID"
            printf 'OBSERVER_TELEGRAM_ALLOWED_USER_IDS=%s\n' "$OBSERVER_TELEGRAM_ALLOWED_USER_IDS"
          } | ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            umask 077
            cat > /var/lib/observer-sandbox/secrets.env
            chmod 600 /var/lib/observer-sandbox/secrets.env
          '

      - name: Install application runtime
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            test -d .venv || python3 -m venv .venv
            .venv/bin/pip install -e .
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            .venv/bin/sandboxctl init
          '

      - name: Verify cognition recovery
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            if grep -Eq "^OBSERVER_GROQ_API_KEY=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              if .venv/bin/sandboxctl ai bootstrap-groq-cognition; then
                echo "Groq cognition bootstrap/catalog step succeeded"
              elif grep -Eq "^OBSERVER_GEMINI_API_KEY=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
                echo "Groq bootstrap failed; trying Gemini bootstrap"
                .venv/bin/sandboxctl ai bootstrap-gemini-cognition
              else
                echo "Groq bootstrap failed; preserving existing cognition binding"
              fi
            elif grep -Eq "^OBSERVER_GEMINI_API_KEY=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              .venv/bin/sandboxctl ai bootstrap-gemini-cognition
            else
              echo "Cognition bootstrap skipped: no supported credential provisioned"
            fi
            .venv/bin/python -m observer_sandbox.ai_recovery --db "$OBSERVER_SANDBOX_DB" --character char_darian
          '

      - name: Verify installed service entrypoint
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            UNIT_TEXT=$(/usr/bin/systemctl cat observer-sandbox)
            printf "%s\n" "$UNIT_TEXT"
            if printf "%s\n" "$UNIT_TEXT" | grep -Fq "observer_sandbox.service_supervisor"; then
              test -f src/observer_sandbox/service_supervisor.py
              echo "SERVICE_ENTRYPOINT=legacy-compatible-supervisor-shim"
            elif printf "%s\n" "$UNIT_TEXT" | grep -Fq "observer_sandbox.service"; then
              echo "SERVICE_ENTRYPOINT=canonical-service"
            else
              echo "Unsupported observer-sandbox systemd entrypoint" >&2
              exit 1
            fi
          '

      - name: Restart runtime service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            sudo -n /usr/bin/systemctl restart observer-sandbox
            sudo -n /usr/bin/systemctl is-active observer-sandbox
          '

      - name: Verify runtime health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            sleep 6
            sudo -n /usr/bin/systemctl is-active observer-sandbox
            .venv/bin/python -c "import json,sqlite3; uri='file:/var/lib/observer-sandbox/observer.sqlite3?mode=ro'; db=sqlite3.connect(uri,uri=True,timeout=10); db.row_factory=sqlite3.Row; check=db.execute('PRAGMA quick_check').fetchone()[0]; assert check == 'ok', f'SQLITE_QUICK_CHECK={check}'; version=db.execute(\"SELECT value FROM schema_meta WHERE key='schema_version'\").fetchone(); assert version is not None, 'schema_version missing'; runtime={r['key']:json.loads(r['value_json']) for r in db.execute('SELECT key,value_json FROM runtime_state ORDER BY key')}; print('RUNTIME_DB_READABLE=true'); print('SQLITE_QUICK_CHECK=ok'); print('SCHEMA_VERSION='+str(version[0])); print('RUNTIME_STATE='+json.dumps(runtime,sort_keys=True))"
            .venv/bin/python -c "import json,sqlite3; db=sqlite3.connect('file:/var/lib/observer-sandbox/observer.sqlite3?mode=ro',uri=True,timeout=10); db.row_factory=sqlite3.Row; err=db.execute(\"SELECT sim_time,payload_json FROM events WHERE actor_id=? AND event_type='autonomy_error' ORDER BY id DESC LIMIT 1\",('char_darian',)).fetchone(); rec=db.execute(\"SELECT sim_time,payload_json FROM events WHERE actor_id=? AND event_type='autonomy_recovery' ORDER BY id DESC LIMIT 1\",('char_darian',)).fetchone(); provider=db.execute(\"SELECT sim_time,payload_json FROM events WHERE actor_id=? AND event_type='cognition_provider_recovered' ORDER BY id DESC LIMIT 1\",('char_darian',)).fetchone(); started=db.execute(\"SELECT sim_time,payload_json FROM events WHERE actor_id=? AND event_type='action_started' ORDER BY id DESC LIMIT 1\",('char_darian',)).fetchone(); print('LATEST_AUTONOMY_ERROR='+json.dumps(None if err is None else {'sim_time':err['sim_time'],**json.loads(err['payload_json'] or '{}')},sort_keys=True)); print('LATEST_AUTONOMY_RECOVERY='+json.dumps(None if rec is None else {'sim_time':rec['sim_time'],**json.loads(rec['payload_json'] or '{}')},sort_keys=True)); print('LATEST_PROVIDER_RECOVERY='+json.dumps(None if provider is None else {'sim_time':provider['sim_time'],**json.loads(provider['payload_json'] or '{}')},sort_keys=True)); print('LATEST_ACTION_STARTED='+json.dumps(None if started is None else {'sim_time':started['sim_time'],**json.loads(started['payload_json'] or '{}')},sort_keys=True))"
            if grep -Eq "^OBSERVER_TELEGRAM_BOT_TOKEN=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              echo "TELEGRAM_BOT_TOKEN_PRESENT=true"
              TOKEN=$(sed -n "s/^OBSERVER_TELEGRAM_BOT_TOKEN=//p" /var/lib/observer-sandbox/secrets.env | head -n1)
              TG_JSON=$(curl -sS --max-time 15 "https://api.telegram.org/bot${TOKEN}/getMe")
              TG_OK=$(printf "%s\n" "$TG_JSON" | .venv/bin/python -c "import json,sys; d=json.load(sys.stdin); print(str(bool(d.get(\"ok\"))).lower())")
              if [ "$TG_OK" = "true" ]; then
                echo "TELEGRAM_API_CONNECTED=true"
              else
                echo "TELEGRAM_API_CONNECTED=false"
                printf "%s\n" "$TG_JSON" | .venv/bin/python -c "import json,sys; d=json.load(sys.stdin); print(\"TELEGRAM_API_ERROR_CODE=\" + str(d.get(\"error_code\", \"\"))); print(\"TELEGRAM_API_DESCRIPTION=\" + str(d.get(\"description\", \"\")))"
                exit 1
              fi
            else
              echo "TELEGRAM_BOT_TOKEN_PRESENT=false"
              echo "TELEGRAM_API_CONNECTED=false"
            fi
            if grep -Eq "^OBSERVER_TELEGRAM_OWNER_ID=[0-9]+$" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              echo "TELEGRAM_OWNER_ID_PRESENT=true"
            else
              echo "TELEGRAM_OWNER_ID_PRESENT=false"
            fi
            if grep -Eq "^OBSERVER_TELEGRAM_ALLOWED_USER_IDS=.+" /var/lib/observer-sandbox/secrets.env 2>/dev/null; then
              echo "TELEGRAM_ALLOWED_USERS_PRESENT=true"
            else
              echo "TELEGRAM_ALLOWED_USERS_PRESENT=false"
            fi
          '
