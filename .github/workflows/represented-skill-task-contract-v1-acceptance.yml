name: Represented Skill Task Contract v1 Acceptance

on:
  pull_request:
    paths:
      - 'config/represented_skill_tasks.v1.json'
      - 'config/skill_definitions.v1.json'
      - 'src/observer_sandbox/represented_skill_tasks.py'
      - 'src/observer_sandbox/skill_application_requirements.py'
      - 'src/observer_sandbox/skill_definitions.py'
      - 'tests/test_represented_skill_tasks_v1.py'
      - '.github/workflows/represented-skill-task-contract-v1-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'config/represented_skill_tasks.v1.json'
      - 'config/skill_definitions.v1.json'
      - 'src/observer_sandbox/represented_skill_tasks.py'
      - 'src/observer_sandbox/skill_application_requirements.py'
      - 'src/observer_sandbox/skill_definitions.py'
      - 'tests/test_represented_skill_tasks_v1.py'
      - '.github/workflows/represented-skill-task-contract-v1-acceptance.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_skill_definition_format_v1.py tests/test_skill_application_requirements_v1.py tests/test_skill_capability_resolution_v1.py tests/test_represented_skill_tasks_v1.py
