name: Sexual Anatomy Physiology Lifecycle v1 Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/sexual_anatomy_physiology_lifecycle.v1.json'
      - 'src/observer_sandbox/sexual_anatomy_physiology_lifecycle.py'
      - 'src/observer_sandbox/sexual_state_schema.py'
      - 'scripts/validation/validate_sexual_anatomy_physiology_lifecycle_v1.py'
      - 'tests/test_sexual_anatomy_physiology_lifecycle_v1.py'
      - '.github/workflows/sexual-anatomy-physiology-lifecycle-v1-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    uses: ./.github/workflows/reusable-production-copy-validation.yml
    with:
      validator_path: scripts/validation/validate_sexual_anatomy_physiology_lifecycle_v1.py
    secrets: inherit
