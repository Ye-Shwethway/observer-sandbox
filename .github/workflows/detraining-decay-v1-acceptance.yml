name: Detraining Decay v1 Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/observer_sandbox/detraining_decay.py'
      - 'tests/test_detraining_decay_v1.py'
      - 'docs/DETRAINING_DECAY_V1.md'
      - '.github/workflows/detraining-decay-v1-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Stage candidate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/observer-detraining-decay-v1 && mkdir -p /tmp/observer-detraining-decay-v1'
          rsync -az -e "ssh -p $VPS_PORT" src/ "$VPS_USER@$VPS_HOST:/tmp/observer-detraining-decay-v1/src/"
      - name: Dry-run read-only detraining on production copy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            TMP_DB=$(mktemp /tmp/observer-detraining-decay-v1.XXXXXX.sqlite3)
            trap "rm -f $TMP_DB $TMP_DB-wal $TMP_DB-shm; rm -rf /tmp/observer-detraining-decay-v1" EXIT
            cp /var/lib/observer-sandbox/observer.sqlite3 "$TMP_DB"
            export OBSERVER_SANDBOX_DB="$TMP_DB"
            export PYTHONPATH=/tmp/observer-detraining-decay-v1/src
            .venv/bin/python - <<"PY"
          import json, os
          from observer_sandbox.db import connect
          from observer_sandbox.detraining_decay import detraining_time_factor, strength_detraining_decay_evidence
          from observer_sandbox.simulation import ensure_sim_clock

          db = os.environ["OBSERVER_SANDBOX_DB"]
          with connect(db) as conn:
              before_strength = conn.execute(
                  "SELECT value_json,mode FROM character_profile_values WHERE entity_id=? AND field_key=?",
                  ("char_darian", "raps_pa.strength"),
              ).fetchone()
              before_events = conn.execute("SELECT COUNT(*) FROM events").fetchone()[0]
              sim_time = ensure_sim_clock(conn).isoformat()
              strength = float(json.loads(before_strength["value_json"]))
              evidence = strength_detraining_decay_evidence(
                  conn,
                  "char_darian",
                  as_of_sim_time=sim_time,
                  current_strength=strength,
              )
              assert detraining_time_factor(14) == (0.0, 0.0)
              assert detraining_time_factor(74)[1] > 0.6
              assert 0.0 <= evidence.decay_pressure <= 1.0
              after_strength = conn.execute(
                  "SELECT value_json,mode FROM character_profile_values WHERE entity_id=? AND field_key=?",
                  ("char_darian", "raps_pa.strength"),
              ).fetchone()
              after_events = conn.execute("SELECT COUNT(*) FROM events").fetchone()[0]
              assert dict(after_strength) == dict(before_strength)
              assert after_events == before_events
              print(json.dumps({
                  "ok": True,
                  "disposable": True,
                  "candidate_source": True,
                  "model_calls": 0,
                  "last_strength_stimulus": evidence.last_strength_stimulus_sim_time,
                  "untrained_days": evidence.untrained_days,
                  "decay_pressure": evidence.decay_pressure,
                  "raw_strength_unchanged": True,
                  "events_unchanged": True,
                  "stat_mutation": False
              }, indent=2, sort_keys=True))
          PY
            unset PYTHONPATH
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            echo "--- PRODUCTION READBACK (UNCHANGED) ---"
            .venv/bin/sandboxctl status
          '
