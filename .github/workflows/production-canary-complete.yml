name: Production Canary Completion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-canary-complete.yml'
  workflow_dispatch:

jobs:
  complete-canary:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Complete exactly one armed production canary
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/observer-sandbox
          export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
          .venv/bin/python - <<'PY'
          import json
          from observer_sandbox.autonomy import CANARY_MODE, PENDING_KEY, autonomy_status, autonomy_tick
          from observer_sandbox.db import connect, migrate
          from observer_sandbox.simulation import runtime_value

          db = "/var/lib/observer-sandbox/observer.sqlite3"
          with connect(db) as conn:
              migrate(conn)
              before = autonomy_status(conn)
              print("CANARY_BEFORE=" + json.dumps(before, sort_keys=True))
              if before["mode"] != CANARY_MODE or not before["autonomy_enabled"]:
                  raise SystemExit("Expected an armed canary before completion")
              pending = runtime_value(conn, PENDING_KEY, None)
              if pending is None:
                  raise SystemExit("Expected the already-planned canary action")
              result = autonomy_tick(conn, now_wall=float(pending["due_wall_time"]) + 0.001)
              print("CANARY_COMPLETE_TICK=" + json.dumps(result, sort_keys=True))
              after = autonomy_status(conn)
              print("CANARY_AFTER=" + json.dumps(after, sort_keys=True))
              if after["autonomy_enabled"] or after["mode"] != "normal" or after["pending_action"] is not None:
                  raise SystemExit("Canary did not finish safely")
              if result.get("state") not in {"completed", "recovered_completed"}:
                  raise SystemExit("Unexpected completion state: " + str(result.get("state")))
          PY
          .venv/bin/sandboxctl autonomy-status
          REMOTE
