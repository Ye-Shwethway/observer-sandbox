name: Read-Only Grading Proof Acceptance

on:
  workflow_dispatch:

jobs:
  acceptance:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Stage candidate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/observer-grading-proof && mkdir -p /tmp/observer-grading-proof/config'
          rsync -az -e "ssh -p $VPS_PORT" src/ "$VPS_USER@$VPS_HOST:/tmp/observer-grading-proof/src/"
          rsync -az -e "ssh -p $VPS_PORT" config/profile_sections.v1.json "$VPS_USER@$VPS_HOST:/tmp/observer-grading-proof/config/profile_sections.v1.json"
      - name: Prove derived grade on disposable production copy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/observer-sandbox
            TMP_DB=$(mktemp /tmp/observer-grading-proof.XXXXXX.sqlite3)
            trap "rm -f $TMP_DB $TMP_DB-wal $TMP_DB-shm; rm -rf /tmp/observer-grading-proof" EXIT
            cp /var/lib/observer-sandbox/observer.sqlite3 "$TMP_DB"
            export OBSERVER_SANDBOX_DB="$TMP_DB"
            export PYTHONPATH=/tmp/observer-grading-proof/src
            .venv/bin/python - <<"PY"
          import json, os
          from observer_sandbox.db import connect
          from observer_sandbox.grading import evaluate_raps_100
          from observer_sandbox.profile_observer import profile_section
          from observer_sandbox.telegram_profile_browser import _fmt_profile_section

          def fmt_number(value):
              return f"{float(value):.1f}".rstrip("0").rstrip(".")

          db = os.environ["OBSERVER_SANDBOX_DB"]
          with connect(db) as conn:
              before = conn.execute(
                  "SELECT value_json, mode FROM character_profile_values WHERE entity_id=? AND field_key=?",
                  ("char_darian", "raps_pa.strength"),
              ).fetchone()
              raw = float(json.loads(before["value_json"]))
              expected = evaluate_raps_100(raw)
              data = profile_section(conn, "char_darian", "attributes")
              strength = next(item for item in data["content"] if item["field_key"] == "raps_pa.strength")
              text = _fmt_profile_section(data)
              after = conn.execute(
                  "SELECT value_json, mode FROM character_profile_values WHERE entity_id=? AND field_key=?",
                  ("char_darian", "raps_pa.strength"),
              ).fetchone()
              assert float(strength["value"]) == raw
              assert strength["grade"]["scheme_id"] == "raps-100-proof-v1"
              assert strength["grade"]["grade"] == expected.grade
              assert strength["grade"]["label"] == expected.label
              assert f"Strength   {fmt_number(raw)} ({expected.grade}) · {expected.label}" in text
              assert tuple(before) == tuple(after)
              print(json.dumps({
                  "ok": True,
                  "disposable": True,
                  "candidate_source": True,
                  "model_calls": 0,
                  "raw_strength": strength["value"],
                  "grade": strength["grade"],
                  "raw_unchanged": True,
                  "telegram_rendered": True
              }, indent=2, sort_keys=True))
          PY
            unset PYTHONPATH
            export OBSERVER_SANDBOX_DB=/var/lib/observer-sandbox/observer.sqlite3
            echo "--- PRODUCTION READBACK (UNCHANGED) ---"
            .venv/bin/sandboxctl status
          '
